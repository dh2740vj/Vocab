function quizPool(words, dir){
  const key = dir === 't2m' ? 'meaning' : 'term';
  const uniq = arr => new Set(arr.map(w => norm(w[key]))).size;
  return uniq(words) >= 4 ? words : db.words;

function buildQuestion(w, dir, pool){
  const key = dir === 't2m' ? 'meaning' : 'term';
  const answer = w[key];
  const seen = new Set([norm(answer)]);
  const distractors = [];
  for (const o of shuffle(pool)) {
    if (o.id === w.id) continue;
    const k = norm(o[key]);
    if (seen.has(k)) continue;
    seen.add(k); distractors.push(o[key]);
    if (distractors.length === 3) break;
  }
  return { id: w.id, prompt: dir === 't2m' ? w.term : w.meaning, answer, choices: shuffle([answer, ...distractors]) };
}

/* ============ CSV 파일 불러오기 ============ */
// 엑셀·구글 시트·Anki에서 내보낸 CSV/TSV를 읽어 새 단어장으로 만들거나 기존 단어장에 넣음
let csvState = null;
const CSV_HEAD = {
  term: /^(word|words|term|front|vocab|vocabulary|단어|어휘|표제어|영단어|english|croatian|serbian|hrvatski|srpski|en|hr|sr)$/i,
  meaning: /^(meaning|meanings|back|definition|translation|korean|뜻|의미|해석|한국어|번역|ko|kr)$/i,
  example: /^(example|examples|sentence|예문|예시|예시문)$/i,
  note: /^(note|notes|memo|grammar|gender|메모|문법|비고|참고|성)$/i
};
// 파일 바이트 → 글자. UTF-8이 아니면 한국어 윈도우 엑셀 기본값(EUC-KR/CP949)으로 다시 읽음
function decodeCsv(buf){
  let text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { try { text = new TextDecoder('euc-kr').decode(buf); } catch (e2) { text = new TextDecoder('utf-8').decode(buf); } }
  return text.replace(/^﻿/, '');
}
// 쉼표·세미콜론·탭 중 첫 줄에 가장 많은 것을 구분자로. 따옴표 안의 쉼표·줄바꿈도 처리
function parseCsv(text){
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const count = ch => { let n = 0, q = false; for (const c of first) { if (c === '"') q = !q; else if (c === ch && !q) n++; } return n; };
  const delim = [['\t', count('\t')], [',', count(',')], [';', count(';')]].sort((a, b) => b[1] - a[1])[0];
  const sep = delim[1] ? delim[0] : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"' && cell === '') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x));
}
function guessCsvMap(rows){
  const head = rows[0] || [];
  const find = re => head.findIndex(h => re.test(h.replace(/\s+/g, '')));
  const t = find(CSV_HEAD.term), m = find(CSV_HEAD.meaning), x = find(CSV_HEAD.example), nt = find(CSV_HEAD.note);
  const hasHeader = t >= 0 || m >= 0 || x >= 0;
  const cols = Math.max(...rows.slice(0, 50).map(r => r.length), 1);
  const term = t >= 0 ? t : 0;
  const meaning = m >= 0 ? m : (term === 0 && cols > 1 ? 1 : cols > 1 ? 0 : -1);
  const example = x >= 0 ? x : (cols > 2 && ![term, meaning].includes(2) ? 2 : -1);
  const note = nt >= 0 ? nt : -1;
  return { hasHeader, cols, term, meaning, example, note };
}
function guessLang(rows, map){
  const sample = rows.slice(map.hasHeader ? 1 : 0, 60).map(r => r[map.term] || '').join(' ');
  if (/[đĐ]/.test(sample)) return 'hr-HR';
  if (/[čćšžČĆŠŽ]/.test(sample)) return 'hr-HR';
  if (/[а-яА-ЯђјљњћџЂЈЉЊЋЏ]/.test(sample)) return 'sr-RS';
  return 'en-US';
}
async function openCsvFile(file, target){
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast('파일이 너무 커요. 5MB 이하 CSV를 골라 주세요.', 3200); return; }
  let rows;
  try { rows = parseCsv(decodeCsv(await file.arrayBuffer())); } catch (e) { rows = []; }
  if (!rows.length) { toast('읽을 수 있는 내용이 없어요. CSV 파일인지 확인해 주세요.', 3200); return; }
  const map = guessCsvMap(rows);
  csvState = {
    fileName: file.name, rows, ...map,
    target: target || 'new',
    name: file.name.replace(/\.(csv|tsv|txt)$/i, '').trim() || '불러온 단어장',
    lang: guessLang(rows, map), fill: true, skipDup: true, busy: ''
  };
  renderCsvSheet();
}
function csvItems(){
  const s = csvState; if (!s) return [];
  return s.rows.slice(s.hasHeader ? 1 : 0).map(r => ({
    term: (r[s.term] || '').trim(),
    meaning: s.meaning >= 0 ? (r[s.meaning] || '').trim() : '',
    example: s.example >= 0 ? (r[s.example] || '').trim() : '',
    note: s.note >= 0 ? (r[s.note] || '').trim() : ''
  })).filter(x => x.term);
}
// 가져올 목록 정리: 파일 안 중복, 대상 단어장에 이미 있는 단어
function csvPlan(){
  const s = csvState, items = csvItems();
  const existing = new Set();
  if (s.target !== 'new') db.words.filter(w => w.deckId === s.target).forEach(w => termKeys(w.term).forEach(k => existing.add(k)));
  const seen = new Set(); let dupFile = 0, dupDeck = 0;
  const keep = [];
  items.forEach(it => {
    const keys = termKeys(it.term);
    if (keys.some(k => seen.has(k))) { dupFile++; return; }
    keys.forEach(k => seen.add(k));
    if (keys.some(k => existing.has(k))) { dupDeck++; if (s.skipDup) return; }
    keep.push(it);
  });
  return { items, keep, dupFile, dupDeck, empty: keep.filter(x => !x.meaning).length };
}
function renderCsvSheet(){
  const s = csvState; if (!s) return;
  const plan = csvPlan();
  const colOpts = (sel, allowNone) => (allowNone ? `<option value="-1" ${sel < 0 ? 'selected' : ''}>없음</option>` : '') +
    Array.from({ length: s.cols }, (_, i) => {
      const label = s.hasHeader && s.rows[0][i] ? `${i + 1}열 · ${s.rows[0][i]}` : `${i + 1}열 · ${(s.rows[s.hasHeader ? 1 : 0] || [])[i] || ''}`;
      return `<option value="${i}" ${sel === i ? 'selected' : ''}>${esc(label.slice(0, 28))}</option>`;
    }).join('');
  const preview = plan.items.slice(0, 5);
  const isNew = s.target === 'new';
  openSheet(`
    <div class="row split"><h2 style="font-size:20px">CSV 불러오기</h2><button type="button" class="btn ghost" data-action="csv-cancel">닫기</button></div>
    <p class="muted" style="font-size:13px;overflow-wrap:anywhere">${esc(s.fileName)} · <span class="num">${plan.items.length}</span>줄</p>

    <div class="field"><label for="csvTarget">넣을 곳</label>
      <select class="select" id="csvTarget"><option value="new" ${isNew ? 'selected' : ''}>새 단어장 만들기</option>
        ${db.decks.map(d => `<option value="${d.id}" ${s.target === d.id ? 'selected' : ''}>${esc(d.name)}에 추가</option>`).join('')}</select></div>
    ${isNew ? `<div class="grid2 csvname">
      <div class="field"><label for="csvName">단어장 이름</label><input class="input" id="csvName" value="${esc(s.name)}"></div>
      <div class="field"><label for="csvLang">언어</label><select class="select" id="csvLang">${langOptions(s.lang)}</select></div>
    </div>` : ''}

      ${!isNew && plan.dupDeck ? `<label class="check"><input type="checkbox" id="csvSkipDup" ${s.skipDup ? 'checked' : ''}> 단어장에 이미 있는 <b class="num">${plan.dupDeck}</b>개는 빼기</label>` : ''}
      ${plan.empty ? `<label class="check"><input type="checkbox" id="csvFill" ${s.fill ? 'checked' : ''}> 뜻이 빈 <b class="num">${plan.empty}</b>개는 자동으로 찾아 채우기</label>

    </div>`, true);
  $('sheet').dataset.lock = s.busy ? '1' : '';

async function runCsvImport(){
  const s = csvState; if (!s || s.busy) return;
  if (s.target === 'new' && !s.name.trim()) { toast('단어장 이름을 적어 주세요'); $('csvName')?.focus(); return; }
  const plan = csvPlan();
  let list = plan.keep.map(x => ({ ...x }));
  let notFound = 0, skippedEmpty = 0;
  const lang = s.target === 'new' ? s.lang : deckLang(s.target);
  const need = list.filter(x => !x.meaning);
  if (need.length && s.fill) {
    s.busy = `뜻 찾는 중… 0/${need.length}`; renderCsvSheet();
    try {
      const found = await lookupMany([...new Set(need.map(x => x.term))], lang, (d, n) => { s.busy = `뜻 찾는 중… ${d}/${n}`; const m = $('csvMsg'); if (m) m.textContent = s.busy; });
      need.forEach(x => { const r = found.get(x.term); if (r && r.meanings.length) { x.meaning = r.meanings[0]; if (!x.example && r.example) x.example = r.example; } });
    } catch (e) { toast(lookupErrorText(e), 3600); }
    s.busy = '';
    if (csvState !== s) return;   // 그사이 창을 닫음
  }
  const before = list.length;
  list = list.filter(x => x.meaning);
  if (s.fill) notFound = before - list.length; else skippedEmpty = before - list.length;
  if (!list.length) { renderCsvSheet(); toast('넣을 수 있는 단어가 없어요. 뜻 열을 확인해 주세요.', 3200); return; }

  let deckId = s.target;
  if (deckId === 'new') {
    const d = { id: uid(), name: s.name.trim(), lang: s.lang, createdAt: Date.now(), updatedAt: Date.now() };
    db.decks.push(d); deckId = d.id;
  }
  list.forEach(x => addWord(deckId, x.term, x.meaning, x.example, x.note));
  csvState = null; delete $('sheet').dataset.lock; closeSheet();
  db.settings.currentDeck = deckId; deckOpen = true; view = 'words'; searchText = '';
  save(); resetSessions(); window.scrollTo(0, 0); render();
  const notes = [];
  if (plan.dupFile) notes.push(`파일 안 중복 ${plan.dupFile}개`);
  if (s.target !== 'new' && s.skipDup && plan.dupDeck) notes.push(`이미 있던 ${plan.dupDeck}개`);
  if (notFound) notes.push(`뜻을 못 찾은 ${notFound}개`);
  if (skippedEmpty) notes.push(`뜻이 빈 ${skippedEmpty}개`);
  toast(`${list.length}개를 넣었어요${notes.length ? ' · 뺀 것: ' + notes.join(', ') : ''}`, 4200);
}

async function authRun(kind){
  const email = $('authEmail')?.value.trim() || '', pw = $('authPw')?.value || '';
  const msg = $('authMsg');
  const say = (t, bad) => { if (msg) { msg.textContent = t; msg.style.color = bad ? 'var(--bad)' : ''; } };
  if (!email) { say('이메일을 입력해 주세요.', true); $('authEmail')?.focus(); return; }
  if (kind !== 'reset' && pw.length < 6) { say('비밀번호를 6자 이상 입력해 주세요.', true); $('authPw')?.focus(); return; }
  const btns = document.querySelectorAll('#authForm button'); btns.forEach(b => b.disabled = true);
  say(kind === 'reset' ? '메일을 보내는 중…' : kind === 'signup' ? '계정을 만드는 중…' : '로그인하는 중…');
  try {
    if (kind === 'reset') { await Sync.adapter.resetPassword(email); say(`${email}로 비밀번호 재설정 메일을 보냈어요.`); }
    else if (kind === 'signup') { await Sync.adapter.signUp(email, pw); toast('계정을 만들고 로그인했어요'); }
    else { await Sync.adapter.signIn(email, pw); toast('로그인했어요'); }
  } catch (err) {
    say(AUTH_ERR[err && err.code] || '처리하지 못했어요. 잠시 후 다시 해 주세요.', true);
  } finally { btns.forEach(b => b.disabled = false); }
}

  'bulk-add': async () => {
    const text = $('bulkText').value;
    const deckId = $('fDeck').value;
    let rows = [], skipped = 0;
    text.split(/\r?\n/).forEach(line => {
      if (!line.trim()) return;
      const sep = line.includes('\t') ? '\t' : line.includes(',') ? ',' : null;
      const parts = sep ? line.split(sep).map(p => p.trim()) : [line.trim()];
      if (!parts[0]) { skipped++; return; }
      // 쉼표로 나눈 경우 세 번째 칸 이후는 예문으로 합침
      const example = sep === '\t' ? (parts[2] || '') : parts.slice(2).join(', ');
      rows.push({ term: parts[0], meaning: parts[1] || '', example, line });
    });
    if (!rows.length) { toast(skipped ? '형식을 확인해 주세요' : '추가할 단어를 적어 주세요'); return; }
    // 뜻이 비어 있는 줄은 자동으로 찾아 채움
    const need = rows.filter(r => !r.meaning);
    let failed = [];
    if (need.length) {
      const btn = $('bulkBtn'), st = $('bulkState');
      btn.disabled = true; st.textContent = `뜻 찾는 중… 0/${need.length}`;
      try {
        const found = await lookupMany([...new Set(need.map(r => r.term))], deckLang(deckId), (d, n) => { st.textContent = `뜻 찾는 중… ${d}/${n}`; });
        need.forEach(r => {
          const res = found.get(r.term);
          if (res && res.meanings.length) { r.meaning = res.meanings[0]; if (!r.example && res.example) r.example = res.example; }
        });
      } catch (e) {
        toast(lookupErrorText(e), 3600);
      } finally {
        if ($('bulkBtn')) { $('bulkBtn').disabled = false; $('bulkState').textContent = ''; }
      }
      failed = rows.filter(r => !r.meaning);
      rows = rows.filter(r => r.meaning);
      if (!rows.length) { toast('뜻을 찾지 못했어요. 철자를 확인하거나 "단어, 뜻" 형식으로 적어 주세요', 3600); return; }
    }
    // 이미 있는 단어, 그리고 붙여 넣은 목록 안에서 겹치는 단어를 찾음
    const seen = new Set();
    rows.forEach(r => {
      const keys = termKeys(r.term);
      const existing = findDuplicates(r.term);
      const inBatch = keys.some(k => seen.has(k));
      keys.forEach(k => seen.add(k));
      r.dupOf = existing[0] || null;
      r.dupInBatch = !existing.length && inBatch;
    });
    const dups = rows.filter(r => r.dupOf || r.dupInBatch);
    pendingBulk = { deckId, rows, skipped, failed: failed.map(r => r.line) };
    if (!dups.length) { commitBulk(false); return; }
    const shown = dups.slice(0, 8);
    $('bulkNotice').innerHTML = `<div class="notice">
      <div class="warnhead"><i>!</i><strong>겹치는 단어가 ${dups.length}개 있어요</strong></div>
      <p class="muted" style="font-size:13px">추가하려는 ${rows.length}개 중 아래 단어는 이미 단어장에 있거나 목록 안에서 두 번 나와요.</p>
      <ul class="duplist">${shown.map(r => `<li><b>${esc(r.term)}</b><span>${r.dupOf
        ? `이미 있음 · ${esc(r.dupOf.meaning)} (${esc(deckById(r.dupOf.deckId)?.name || '')})`
        : '목록 안에서 중복'}</span></li>`).join('')}</ul>
      ${dups.length > shown.length ? `<p class="muted" style="font-size:13px">외 ${dups.length - shown.length}개</p>` : ''}
      <div class="row end">
        <button class="btn ghost" data-action="notice-close" data-target="bulkNotice">취소</button>
        <button class="btn" data-action="bulk-commit" data-all="1">모두 추가</button>
        <button class="btn primary" data-action="bulk-commit">겹치는 것 빼고 (${rows.length - dups.length}개)</button>
      </div></div>`;
    $('bulkNotice').scrollIntoView({ block: 'nearest' });
  },
  'bulk-commit': a => commitBulk(a.dataset.all === '1'),
  'notice-close': a => { $(a.dataset.target).innerHTML = ''; pendingAdd = pendingBulk = null; $('fTerm')?.focus(); },

document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (a && !a.disabled && actions[a.dataset.action]) { actions[a.dataset.action](a, e); return; }
  if (e.target === $('sheet') && !$('sheet').dataset.lock) { csvState = null; closeSheet(); }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'authForm') { authRun('signin'); return; }
  if (f.id === 'addForm') {
    const term = $('fTerm').value.trim(), meaning = $('fMeaning').value.trim();
    if (!term) return;
    if (!meaning) { $('fMeaning').focus(); lookupSingle(false); return; }
    const dups = findDuplicates(term);
    if (dups.length) {
      pendingAdd = { deckId: $('fDeck').value, term, meaning, example: $('fExample').value, note: $('fNote') ? $('fNote').value : '' };
      $('addNotice').innerHTML = `<div class="notice">
        <div class="warnhead"><i>!</i><strong>'${esc(term)}'은(는) 이미 있는 단어예요</strong></div>
        <ul class="duplist">${dups.map(w => `<li><b>${esc(w.term)}</b><span>${esc(w.meaning)} · ${esc(deckById(w.deckId)?.name || '')}</span></li>`).join('')}</ul>
        <div class="row end">
          <button type="button" class="btn ghost" data-action="notice-close" data-target="addNotice">취소</button>
          ${dups.length === 1 ? `<button type="button" class="btn" data-action="dup-edit" data-id="${dups[0].id}">기존 단어 수정</button>` : ''}
          <button type="button" class="btn primary" data-action="dup-add-anyway">그래도 추가</button>
        </div></div>`;
      $('addNotice').scrollIntoView({ block: 'nearest' });
      return;
    }
    addWord($('fDeck').value, term, meaning, $('fExample').value, $('fNote') ? $('fNote').value : '');
    afterSingleAdd(term);
  } else if (f.id === 'editForm') {
    const w = wordById(f.dataset.id); if (!w) return;
    w.term = $('eTerm').value.trim() || w.term;
    w.meaning = $('eMeaning').value.trim() || w.meaning;
    w.example = $('eExample').value.trim();
    const nt = $('eNote').value.trim(); if (nt) w.note = nt; else delete w.note;
    w.deckId = $('eDeck').value;
    setUnknown(w, $('eUnknown').checked);
    w.updatedAt = Date.now();
    save(); closeSheet(); resetSessions(); render(); toast('저장했어요');
  } else if (f.id === 'meanForm') {
    const s = sessions.mean; if (!s || s.answered) return;
    const w = wordById(s.queue[s.i]); if (!w) return;
    s.input = $('meanInput').value;
    if (!s.input.trim()) { toast('뜻을 입력해 주세요'); return; }
    s.ok = isMeaningMatch(s.input, w.meaning);
    s.snap = { box: w.box, nextReview: w.nextReview, correct: w.correct, wrong: w.wrong };
    s.answered = true;
    grade(w.id, s.ok);
    if (s.ok) s.score++; else s.missed.push(w.id);
    render();
    $('mnNext')?.focus({ preventScroll: true });
  } else if (f.id === 'dictForm') {
    const s = sessions.dict; if (!s || s.answered) return;
    const w = wordById(s.queue[s.i]); if (!w) return;
    s.input = $('dictInput').value;
    if (!s.input.trim()) { toast('들은 단어를 입력해 주세요'); return; }
    s.ok = isMatch(s.input, w.term);
    s.near = !s.ok && isLooseMatch(s.input, w.term);
    if (s.near) s.ok = true;   // 부호만 다르면 정답으로 치되 알려 줌
    s.answered = true;
    grade(w.id, s.ok);
    if (s.ok) s.score++; else s.missed.push(w.id);
    render();
    $('dcNext')?.focus({ preventScroll: true });
  } else if (f.id === 'deckForm') {
    const name = $('newDeck').value.trim(); if (!name) return;
    const d = { id: uid(), name, lang: $('newDeckLang').value, createdAt: Date.now(), updatedAt: Date.now() };
    db.decks.push(d); db.settings.currentDeck = d.id;
    save(); resetSessions(); render(); toast(`'${name}' 단어장을 만들었어요`);
  } else if (f.id === 'newDeckSheet') {
    const name = $('ndName').value.trim(); if (!name) return;
    const d = { id: uid(), name, lang: $('ndLang').value, createdAt: Date.now(), updatedAt: Date.now() };
    db.decks.push(d); db.settings.currentDeck = d.id; deckOpen = true; searchText = '';
    save(); closeSheet(); resetSessions(); render(); toast(`'${name}' 단어장을 만들었어요`);
    openAddSheet('one');
  } else if (f.id === 'groupForm') {
    const name = $('gName').value.trim(); if (!name) { $('gName').focus(); return; }
    const deckIds = [...f.querySelectorAll('input[name=gDeck]:checked')].map(x => x.value);
    const examDate = $('gDate').value || '';
    let g = groupById(f.dataset.id);
    if (g) Object.assign(g, { name, deckIds, examDate, updatedAt: Date.now() });
    else { g = { id: uid(), name, deckIds, examDate, createdAt: Date.now(), updatedAt: Date.now() }; db.groups.push(g); }
    save(); closeSheet(); resetSessions(); render();
    toast(f.dataset.id ? '그룹을 저장했어요' : `'${name}' 그룹을 만들었어요`);
  } else if (f.id === 'renameForm') {
    const d = deckById(f.dataset.id); const name = $('renameIn').value.trim();
    if (d && name) { d.name = name; d.updatedAt = Date.now(); save(); }
    closeSheet(); render();
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'csvName' && csvState) { csvState.name = e.target.value; return; }
  if (e.target.id === 'search') { searchText = e.target.value; $('wordList').innerHTML = wordItems(currentWords()); }
  if (e.target.id === 'rateIn') { db.settings.rate = Number(e.target.value); $('rateOut').textContent = db.settings.rate.toFixed(2); save(); }
  if (e.target.id === 'dictInput' && sessions.dict) sessions.dict.input = e.target.value;
  if (e.target.id === 'meanInput' && sessions.mean) sessions.mean.input = e.target.value;
  if (e.target.id === 'fTerm') {
    clearTimeout(lookTimer);
    // 단어가 바뀌면 이전 단어로 자동 채운 뜻·예문은 지움 (직접 쓴 내용은 그대로 둠)
    if (autoMeaning && $('fMeaning').value === autoMeaning) $('fMeaning').value = autoMeaning = '';
    if (autoExample && $('fExample').value === autoExample) $('fExample').value = autoExample = '';
    lookSeq++; setLookState(''); showSuggest(null);
    if ($('addNotice')) { $('addNotice').innerHTML = ''; pendingAdd = null; }
    if (!e.target.value.trim()) return;
    lookTimer = setTimeout(() => { if (!$('fMeaning')?.value.trim()) lookupSingle(true); }, 1200);
  }
  if (e.target.id === 'fMeaning' && !$('suggest').hidden) {
    const parts = currentMeaningParts();
    document.querySelectorAll('#suggest .pick').forEach(b => b.setAttribute('aria-pressed', parts.includes(b.dataset.m)));
  }
});
document.addEventListener('change', e => {
  if (e.target.id && e.target.id.startsWith('cnt-')) {
    const n = Math.floor(Number(e.target.value)), max = Number(e.target.max);
    if (!n || n < 1) { render(); return; }
    setCount(e.target.dataset.mode, n >= max ? 'all' : n); render(); return;
  }
  if (e.target.id === 'csvFile') { const f = e.target.files && e.target.files[0]; closeSheet(); openCsvFile(f, e.target.dataset.target); return; }
  if (csvState && /^csv/.test(e.target.id)) {
    const s = csvState, v = e.target.value;
    if (e.target.id === 'csvTarget') s.target = v;
    if (e.target.id === 'csvLang') s.lang = v;
    if (e.target.id === 'csvTerm') s.term = Number(v);
    if (e.target.id === 'csvMeaning') s.meaning = Number(v);
    if (e.target.id === 'csvExample') s.example = Number(v);
    if (e.target.id === 'csvNote') s.note = Number(v);
    if (e.target.id === 'csvHeader') s.hasHeader = e.target.checked;
    if (e.target.id === 'csvFill') s.fill = e.target.checked;
    if (e.target.id === 'csvSkipDup') s.skipDup = e.target.checked;
    if (e.target.id !== 'csvName') renderCsvSheet();
    return;
  }
  if (e.target.id === 'importFile') {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (f) f.text().then(t => actions['import-ask'](null, null, t), () => toast('파일을 읽지 못했어요'));
    return;
  }
  if (e.target.id === 'srsNewIn' || e.target.id === 'srsRevIn') {
    const k = e.target.id === 'srsNewIn' ? 'newPerDay' : 'revPerDay';
    const n = Math.floor(Number(e.target.value));
    if (Number.isFinite(n) && n >= 0) { db.settings[k] = Math.min(n, Number(e.target.max)); save(); toast('저장했어요'); }
    e.target.value = db.settings[k]; return;
  }
  if (e.target.id === 'wordSort') { db.settings.wordSort = e.target.value; save(); $('wordList').innerHTML = wordItems(currentWords()); }
  if (e.target.classList.contains('decklang')) { const d = deckById(e.target.dataset.id); if (d) { d.lang = e.target.value; d.updatedAt = Date.now(); save(); toast(`'${d.name}' 언어를 바꿨어요`); } }
  if (e.target.id === 'fDeck') { lastLooked = ''; syncAddLang(); }
  if (e.target.id === 'fTerm') { clearTimeout(lookTimer); if (!$('fMeaning').value.trim() || $('fMeaning').value === autoMeaning) lookupSingle(true); }
});

document.addEventListener('pointerdown', e => { if (e.target.closest('.charpad button')) e.preventDefault(); });
document.addEventListener('mousedown', e => { if (e.target.closest('.charpad button')) e.preventDefault(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('cnt-')) { e.preventDefault(); e.target.blur(); return; }
  // 추가 창: 엔터나 탭을 누르면 뜻 찾기 버튼이나 후보를 거치지 않고 다음 칸으로
  if ((e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey)) && ['fTerm', 'fMeaning', 'fExample', 'fNote'].includes(e.target.id)) {
    if (e.isComposing || e.keyCode === 229) return;   // 한글 조합 중인 엔터는 무시
    e.preventDefault();
    if (e.target.id === 'fTerm') {
      if (!e.target.value.trim()) return;
      clearTimeout(lookTimer);
      if (!$('fMeaning').value.trim()) lookupSingle(true);
      $('fMeaning').focus();
    } else if (e.target.id === 'fMeaning') {
      $('fExample').focus();
    } else {
      $('addForm').requestSubmit ? $('addForm').requestSubmit() : $('addForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    }
    return;
  }
  if (e.key === 'Escape' && !$('sheet').hidden) { if (!$('sheet').dataset.lock) closeSheet(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || !$('sheet').hidden) return;
  if (e.key === 'Enter' && MODES[view] && tag !== 'button' && tag !== 'a') {
    // 시작 화면과 결과 화면: 엔터로 바로 시작
    const go = $('view').querySelector('.btn.primary:not(:disabled)');
    if (go && !sessionLive(view)) { e.preventDefault(); go.click(); return; }
  }
  if (view === 'review' && sessions.review && sessions.review.cur) {
    const s = sessions.review;
    if ((e.key === ' ' || e.key === 'Enter') && !s.flipped) { e.preventDefault(); actions['srs-show'](); return; }
    const n = Number(e.key);
    if (s.flipped && n >= 1 && n <= 4) { e.preventDefault(); srsGrade(SRS.RATINGS[n - 1]); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); srsUndo(); return; }
  }
  if (view === 'cards' && sessions.cards && sessions.cards.i < sessions.cards.queue.length) {
    if (e.key === 'ArrowRight') answerCard(true);
    else if (e.key === 'ArrowLeft') answerCard(false);
    else if (e.key === ' ' && e.target.id !== 'cardWrap') { e.preventDefault(); flipCard(); }
  }
  if (view === 'quiz' && sessions.quiz && sessions.quiz.i < sessions.quiz.qs.length) {
    const n = Number(e.key);
    if (n >= 1 && n <= 4 && sessions.quiz.selected === null) chooseQuiz(n - 1);
  }
});

render();
Sync.changed();
</script>
<script type="module" src="firebase-sync.js?v=3"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
