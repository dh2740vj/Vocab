<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFBFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단어장">
<title>내 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 손 모바일 앱. 위 고정 헤더(단어장 선택) + 아래 고정 탭 4개, 학습 카드는 줄 쳐진 인덱스 카드. */
:root{
  --bg:#FBFBFA; --surface:#FFFFFF; --sunk:#F1F0ED; --ink:#1C1D1A; --muted:#6B6A66; --line:#E7E6E1;
  --accent:#1C1D1A; --accent-ink:#FFFFFF; --accent-soft:#EDECE8;
  --pop:#1C1D1A; --pop-ink:#FFFFFF; --pop-soft:#EDECE8; --pop-text:#1C1D1A;
  --heat1:#E4E2DC; --heat2:#9A988F; --heat3:#1C1D1A; --heat-ink:#FFFFFF;
  --t1:#FFE4D6; --t1i:#C2502A; --t2:#DCEAFF; --t2i:#2D62BE; --t3:#D8F2E4; --t3i:#1B8053; --t4:#E9E2FB; --t4i:#6648C0;
  --mark:#FFE08A; --rule:#ECEAE3; --margin:#DB9383;
  --good:#1F8A5B; --good-soft:#DDF0E6; --bad:#B4432F; --bad-soft:#F6E1DB;
  --shadow:0 1px 2px rgba(40,36,28,.05),0 6px 18px rgba(40,36,28,.06);
  --f-display:'Bricolage Grotesque','IBM Plex Sans KR',system-ui,sans-serif;
  --f-body:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151614; --surface:#1E201D; --sunk:#272925; --ink:#ECEBE6; --muted:#A3A199; --line:#30322D;
    --accent:#ECEBE6; --accent-ink:#151614; --accent-soft:#2C2E2A;
  --pop:#ECEBE6; --pop-ink:#151614; --pop-soft:#2C2E2A; --pop-text:#ECEBE6;
  --heat1:#3A3C37; --heat2:#8C8A82; --heat3:#ECEBE6; --heat-ink:#151614;
  --t1:#43281E; --t1i:#F4A283; --t2:#1E2F4A; --t2i:#8DB6F5; --t3:#1B3628; --t3i:#71CF9E; --t4:#2E2648; --t4i:#B5A0F0;
    --mark:#5E4E17; --rule:#2E302B; --margin:#7A3D33;
    --good:#62C590; --good-soft:#1B3326; --bad:#EE8A73; --bad-soft:#3B211C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151614; --surface:#1E201D; --sunk:#272925; --ink:#ECEBE6; --muted:#A3A199; --line:#30322D;
  --accent:#ECEBE6; --accent-ink:#151614; --accent-soft:#2C2E2A;
  --pop:#ECEBE6; --pop-ink:#151614; --pop-soft:#2C2E2A; --pop-text:#ECEBE6;
  --heat1:#3A3C37; --heat2:#8C8A82; --heat3:#ECEBE6; --heat-ink:#151614;
  --t1:#43281E; --t1i:#F4A283; --t2:#1E2F4A; --t2i:#8DB6F5; --t3:#1B3628; --t3i:#71CF9E; --t4:#2E2648; --t4i:#B5A0F0;
  --mark:#5E4E17; --rule:#2E302B; --margin:#7A3D33;
  --good:#62C590; --good-soft:#1B3326; --bad:#EE8A73; --bad-soft:#3B211C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;white-space:nowrap}
.deckpick{margin-left:auto;min-width:0;max-width:52%;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px}
.iconbtn{flex:none;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.iconbtn[aria-current="page"]{border-color:var(--accent);color:var(--accent)}
.iconbtn svg{width:19px;height:19px}

main{padding-block:18px 8px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600;margin:0}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
p{margin:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.input,.select,textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

.btn{min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger:hover{border-color:var(--bad)}
.btn.wide{flex:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}

.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:7px 12px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* 요약 */
.summary{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end}
.stat b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.05;font-weight:700}
.stat span{font-size:13px;color:var(--muted)}
.stat.due b{color:var(--accent)}
@media (max-width:380px){.summary{grid-template-columns:1fr 1fr}.dist{grid-column:1/-1}}

details.panel summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:'+';font-family:var(--f-mono);color:var(--muted);font-size:18px}
details.panel[open] summary::after{content:'−'}
details.panel:not([open]){gap:0}

/* 단어 목록 */
.wordlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.wordlist li{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-top:1px solid var(--line)}
.wordlist li:first-child{border-top:0}
.wordlist .body{flex:1;min-width:0}
.term{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.term.due{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding-inline:1px}
.meaning{overflow-wrap:anywhere}
.example{font-size:13px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.due{background:var(--accent-soft);color:var(--accent);font-weight:600}
.minibtns{display:flex;gap:4px}
.minibtns button{width:34px;height:34px;border:0;background:transparent;border-radius:7px;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.minibtns button:hover{color:var(--accent)}
.minibtns svg{width:17px;height:17px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* 인덱스 카드 */
.progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pop);border-radius:99px;transition:width .3s}
.cardwrap{perspective:1400px;touch-action:pan-y;cursor:grab;transition:transform .25s ease;user-select:none;-webkit-user-select:none}
.cardwrap.dragging{transition:none;cursor:grabbing}
.card{position:relative;height:clamp(250px,46vh,340px);transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;box-shadow:var(--shadow);border:1px solid var(--line);
  background-color:var(--surface);
  background-image:linear-gradient(to bottom,transparent 55px,var(--margin) 55px,var(--margin) 57px,transparent 57px),
    repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-position:0 0,0 57px;background-repeat:no-repeat,repeat;
  display:flex;flex-direction:column;padding:16px 22px 22px}
.face.back{transform:rotateY(180deg)}
.face .head{height:28px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.face .content{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;padding-top:16px;min-width:0}
.face .big{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1.15;overflow-wrap:anywhere;letter-spacing:-.01em}
.face .mid{font-size:clamp(20px,5vw,26px);font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.face .ex{font-size:14px;color:var(--muted);font-style:italic;max-width:34ch}
.cardwrap[data-lean="yes"] .face{border-color:var(--good);box-shadow:0 0 0 3px var(--good-soft),var(--shadow)}
.cardwrap[data-lean="no"] .face{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft),var(--shadow)}
.hint{font-size:13px;color:var(--muted);text-align:center}

/* 받아쓰기 */
.listen{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px}
.playbtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.playbtn:active{transform:scale(.95)}
.playbtn svg{width:40px;height:40px}
.dictinput{font-family:var(--f-display);font-size:22px;font-weight:500;text-align:center;min-height:54px}
.verdict{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict .answer{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--ink)}
.verdict small{color:var(--muted)}
.meaninghint{min-height:24px;text-align:center}
.meaninput{font-size:20px;text-align:center;min-height:54px;font-weight:500}
.askterm{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 8px 8px;text-align:center}
.askterm .big{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,9vw,46px);line-height:1.15;overflow-wrap:anywhere;letter-spacing:-.01em}
.verdict .full{font-size:18px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.duplist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.duplist li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.duplist b{font-family:var(--f-display)}
.duplist span{color:var(--muted);text-align:right;min-width:0;overflow-wrap:anywhere;font-size:14px}
.lookstate{font-size:12px;color:var(--accent);font-weight:500;margin-left:6px}
.suggest{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.suggest .src{font-size:12px;color:var(--muted);width:100%}
.pick{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.pick[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.charpad{display:flex;gap:6px;flex-wrap:wrap}
.charpad button{min-width:42px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:17px;cursor:pointer;color:var(--ink)}
.charpad button:active{background:var(--sunk)}
.decklist li{flex-wrap:wrap;gap:6px 8px}
.decklist li .name{flex:1 1 100%}
.decklist .select{margin-right:auto}
.decklist .select{width:auto;min-height:36px;padding:4px 8px;font-size:14px}
.listhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.listhead > div{flex:1;min-width:0}
.listhead .btn{flex:none}
.listhead p{font-size:13px;color:var(--muted);margin-top:4px}
.decks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.deckcard{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px 14px;cursor:pointer;color:var(--ink);
  box-shadow:0 4px 0 -1px var(--surface),0 4px 0 0 var(--line),0 8px 0 -2px var(--surface),0 8px 0 -1px var(--line)}
.deckcard:hover{border-color:var(--accent)}
.deckcard.empty-deck{box-shadow:none}
.deckcard .dname{font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;min-width:0}
.langtag{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);margin-left:8px;vertical-align:2px;white-space:nowrap}
.deckcard .dmeta{grid-column:1;font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.deckcard .dmeta .due{color:var(--accent);font-weight:600}
.deckcard .chev{grid-column:2;grid-row:1/span 3;color:var(--muted);width:20px;height:20px}
.deckcard .learn{grid-column:1;height:4px;background:var(--sunk);border-radius:99px;overflow:hidden}
.deckcard .learn i{display:block;height:100%;background:var(--good);border-radius:99px}
.alldecks{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:12px 16px;cursor:pointer;color:var(--muted);font-size:14px}
.alldecks:hover{border-color:var(--accent);color:var(--ink)}
.deckcard .tick{grid-column:2;grid-row:1/span 3;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--accent-ink)}
.deckcard .tick svg{width:15px;height:15px}
.deckcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.deckcard[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.pickbar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.pickbar{flex-wrap:nowrap}
.pickbar > div:first-child{flex:1 1 0;min-width:0;font-size:14px}
.pickbar > .row{flex:none;flex-wrap:nowrap;gap:8px}
.pickbar .btn{padding:0 12px}
.pickchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:-6px}
.pickchip{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;display:inline-flex;align-items:center}
.pickchip .langtag{margin-left:6px}
.backbar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:-6px}
.addbtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--pop);color:var(--pop-ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.addbtn:active{transform:scale(.94)}
.addbtn svg{width:22px;height:22px}
.addpane{display:flex;flex-direction:column;gap:12px}
.notice{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.notice .warnhead i{width:24px;height:24px;font-size:13px}
.backbar .btn{padding:0 10px 0 4px;min-height:36px}
.deckhead{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.syncdot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 2px var(--surface)}
.iconbtn{position:relative}
.syncdot[data-state="ok"]{background:var(--good)}
.syncdot[data-state="busy"]{background:var(--accent)}
.syncdot[data-state="error"]{background:var(--bad)}
.syncdot[data-state="out"],.syncdot[data-state="none"]{display:none}
.syncline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.syncline::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.syncline[data-state="ok"]::before{background:var(--good)}
.syncline[data-state="busy"]::before{background:var(--accent)}
.syncline[data-state="error"]{color:var(--bad)}
.syncline[data-state="error"]::before{background:var(--bad)}
.acct{font-weight:600;overflow-wrap:anywhere}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.loginbanner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.optlist{margin:0;border-top:1px solid var(--line)}
.optlist dt{font-weight:600;padding-top:10px}
.optlist dd{margin:2px 0 0;padding-bottom:10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}
.nowrap{white-space:nowrap}
.csvname{grid-template-columns:3fr 2fr!important}
.csvmap{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.csvmap .select{font-size:14px;padding:6px 8px}
.csvmap label{font-size:12px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.csvprev{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.csvprev table{width:100%;border-collapse:collapse;font-size:13px}
.csvprev th{text-align:left;font-weight:600;color:var(--muted);background:var(--bg);padding:6px 8px;font-size:12px}

/* 퀴즈 */
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,7vw,36px);line-height:1.2;text-align:center;overflow-wrap:anywhere;padding:22px 8px}

.choice:hover:not(:disabled){border-color:var(--accent)}

.choice span:last-child{min-width:0;overflow-wrap:anywhere}
.choice.right{border-color:var(--good);background:var(--good-soft)}

/* 결과 */
.result{align-items:center;text-align:center;padding:26px 16px}

.misslist li b{font-family:var(--f-display)}
.misslist li span{color:var(--muted);text-align:right;min-width:0;overflow-wrap:anywhere}

/* 설정 */

.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;padding-right:8px}
.toast button{flex:none;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 8px;cursor:pointer;border-radius:6px}
button,.btn,.choice,.rowname,.term,select,.input{transition:color .2s ease,border-color .2s ease,background-color .2s ease,filter .2s ease}
.pct{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;width:44px}
.pct b{font-size:14px;font-weight:600;color:var(--good)}
.pct i{display:block;width:100%;height:3px;border-radius:99px;background:var(--sunk);overflow:hidden}
.pct u{display:block;height:100%;background:var(--good);border-radius:99px}
.cal{gap:12px}
.calstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.calhead h2{font-size:17px}
.calhead .btn{min-height:34px;padding:0 8px}

.calgrid.wk span{font-size:12px;color:var(--muted)}
.calgrid button{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-family:var(--f-mono);font-size:13px;cursor:pointer;padding:0}
.calgrid button.h1{background:var(--heat1);color:var(--ink)}
.calgrid button.h2{background:var(--heat2);color:var(--heat-ink)}
.calgrid button.h3{background:var(--heat3);color:var(--heat-ink)}
.calgrid button.on{font-weight:600}
.calgrid button.today{border-color:var(--ink);color:var(--ink)}
.calgrid button.on.today{box-shadow:inset 0 0 0 2px var(--surface)}
.calgrid button.h2.today,.calgrid button.h3.today{color:var(--heat-ink)}
.calgrid button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.calfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.legend{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}

.dist{flex:1;min-width:180px;display:flex;flex-direction:column;justify-content:center;gap:6px}

kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface);color:var(--ink)}

.studyscope .due{color:var(--accent);font-weight:600}
.studyscope .unk{color:var(--bad);font-weight:600}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;font-size:12px;color:var(--muted);cursor:pointer;position:relative}

.tabs button[aria-current="page"]::before{content:'';position:absolute;top:0;left:36%;right:36%;height:3px;background:var(--pop);border-radius:0 0 3px 3px}

/* 시트, 토스트, 배너 */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{width:100%;max-width:640px;background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
@media (min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:16px;padding-bottom:20px}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow);pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .4s ease,transform .4s ease,visibility 0s linear .4s}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .4s ease,transform .4s ease,visibility 0s}
.sheet:not([hidden]) ~ .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px}

@media (prefers-reduced-motion: reduce){
  .card,.cardwrap,.bar i,.playbtn,button,.btn,.choice,.rowname,.term,.rowbtn .chev{transition:none!important}

<script>
/* ============================================================
   저장소 계층
   이 기기의 localStorage에 저장합니다. 로그인하면 아래 '서버 동기화'가
   바뀐 내용을 Firebase에 올리고 다른 기기의 변경을 받아 옵니다.
   ============================================================ */
const STORE_KEY = 'vocab-app-v1';
const Store = {
  load() {
    try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  },
  save(data) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); return true; }
    catch (e) { return false; }
  }
};

/* ---------- 유틸 ---------- */
const DAY = 86400000;
// 레이트너 상자별 복습 간격(일). 맞히면 다음 상자로, 틀리면 0번 상자로.
const INTERVALS = [0, 1, 2, 4, 7, 15, 30];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
function startOfToday(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function endOfToday(){ const d = new Date(); d.setHours(23,59,59,999); return d.getTime(); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function norm(s){
  return String(s ?? '').normalize('NFC').toLowerCase()
    .replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/\s+/g, ' ').trim().replace(/[.!?]+$/, '');
}
// "color/colour"처럼 /로 구분한 표기는 모두 정답으로 인정
function isMatch(input, term){ const n = norm(input); return n !== '' && term.split('/').map(norm).some(t => t === n); }
// 부호(č ć đ š ž)를 뺀 비교: 받아쓰기에서 부호만 틀린 답을 가려냄
const loose = s => norm(s).replace(/đ/g, 'd').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function isLooseMatch(input, term){ const n = loose(input); return n !== '' && term.split('/').map(loose).some(t => t === n); }
const HR_CHARS = ['č', 'ć', 'đ', 'š', 'ž'];
const charpadButtons = skipTab => HR_CHARS.map(c => `<button type="button" data-action="ins-char" data-c="${c}" aria-label="${c} 입력"${skipTab ? ' tabindex="-1"' : ''}>${c}</button>`).join('');
const spokenForm = term => term.split('/')[0].trim();

// 중복 확인: "color/colour"처럼 /로 나눈 표기 중 하나라도 겹치면 같은 단어로 봄
const termKeys = term => String(term).split('/').map(norm).filter(Boolean);
function findDuplicates(term, excludeId){
  const keys = new Set(termKeys(term));
  return db.words.filter(w => w.id !== excludeId && termKeys(w.term).some(k => keys.has(k)));
}

// 뜻 채점: 띄어쓰기·문장부호 무시, 뜻이 여러 개면 하나만 맞혀도 정답,
// '-하다 / -한 / -함' 같은 어미 차이는 봐줌
const meaningKey = s => norm(s).replace(/[\s.,;:!?'"()\[\]{}~·…\-]/g, '');
const meaningStem = s => s.replace(/(하다|하는|한|함|하기|되다|된|됨|적인|적|스럽다|스러운|다)$/, '');
function meaningParts(m){ return String(m).split(/[,;\/·]|\s또는\s/).map(meaningKey).filter(Boolean); }
function isMeaningMatch(input, meaning){
  const answers = meaningParts(meaning);
  const whole = meaningKey(meaning);
  const tries = String(input).split(/[,;\/]/).map(meaningKey).filter(Boolean);
  return tries.some(t => {
    if (t === whole || answers.includes(t)) return true;
    const ts = meaningStem(t);
    return ts.length >= 2 && answers.some(a => meaningStem(a) === ts);
  });
}

/* ---------- 예시 데이터 ---------- */
function sampleData(){
  const now = Date.now(), today = startOfToday();
  const deckId = uid();
  const rows = [

}
function validData(d){ return d && Array.isArray(d.decks) && Array.isArray(d.words) && d.decks.length > 0; }
/* SRS-START ================================================
   간격 반복 스케줄러 (안키 SM-2 변형). Firebase·화면과 무관한 순수 함수만 있음.
   나중에 FSRS 같은 다른 방식으로 바꿀 때는 이 블록만 갈아 끼우면 됨.
   카드 상태: { state: new|learning|review|relearning, due(ms), interval(일), ease, step, reps, lapses, lastReviewedAt }
   srs.test.js가 이 블록을 잘라 내 시험함
   ============================================================ */
const SRS = (() => {
  const MIN = 60000, HOUR = 3600000, DAY = 86400000;
  const CFG = {
    learnSteps: [1, 10],      // 학습 단계(분)
    relearnSteps: [10],       // 다시 배우기 단계(분)
    graduate: 1,              // 단계를 다 통과하면 첫 간격(일)
    easyGraduate: 4,          // 새 카드·학습 중에 '쉬움'이면 바로 이 간격(일)
    startEase: 2.5, minEase: 1.3,
    lapseMult: 0.5,           // 복습 카드를 틀리면 간격을 이만큼으로
    hardMult: 1.2, easyBonus: 1.3,
    dayStartHour: 4,          // 하루가 바뀌는 시각 (로컬 새벽 4시)
    learnAhead: 20,           // 할 카드가 없으면 이 시간(분) 안에 돌아올 학습 카드를 당겨서 보여 줌
  };
  const RATINGS = ['again', 'hard', 'good', 'easy'];

  // now가 속한 '학습일'이 시작된 시각 (새벽 4시 전이면 전날 4시)
  function dayStart(now, cfg = CFG){
    const d = new Date(now);
    if (d.getHours() < cfg.dayStartHour) d.setDate(d.getDate() - 1);
    d.setHours(cfg.dayStartHour, 0, 0, 0);
    return d.getTime();
  }
  // 달력 기준으로 n일 뒤 (서머타임이 있어도 같은 시각)
  function addDays(t, n){ const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); }
  function newCard(cfg = CFG){ return { state: 'new', due: 0, interval: 0, ease: cfg.startEase, step: 0, reps: 0, lapses: 0, lastReviewedAt: 0 }; }
  // 첫 단계의 '어려움'은 1단계와 2단계의 중간(단계가 하나면 1.5배), 그 뒤로는 지금 단계 반복
  function hardDelay(steps, i){ return i === 0 ? (steps.length > 1 ? (steps[0] + steps[1]) / 2 : steps[0] * 1.5) : steps[i]; }

  // opts: { capAt } 시험 대비: 다음 복습이 이 시각(시험 전날 새벽 4시)을 넘지 않게
  function schedule(card, rating, now, opts = {}){
    const cfg = opts.cfg || CFG;
    if (!RATINGS.includes(rating)) throw new Error('rating: ' + rating);
    const c = Object.assign(newCard(cfg), card || {});
    const out = Object.assign({}, c, { reps: c.reps + 1, lastReviewedAt: now });
    const toReview = days => {
      out.state = 'review'; out.step = 0; out.interval = days; out.due = addDays(dayStart(now, cfg), days);
      // 시험 상한: 시험 전날을 넘으면 시험 전날로 당김 (오늘이 이미 시험 전날이면 그대로)
      const today = dayStart(now, cfg);
      if (opts.capAt && out.due > opts.capAt && today < opts.capAt) {
        out.due = opts.capAt; out.interval = Math.max(1, Math.round((opts.capAt - today) / DAY));
      }
    };
    const toStep = (steps, i, mins) => { out.step = i; out.due = now + Math.round(mins * MIN); };

    if (c.state !== 'review') {
      const re = c.state === 'relearning';
      const steps = re ? cfg.relearnSteps : cfg.learnSteps;
      const i = Math.min(c.step, steps.length - 1);
      out.state = re ? 'relearning' : 'learning';
      if (rating === 'again') toStep(steps, 0, steps[0]);
      else if (rating === 'hard') toStep(steps, i, hardDelay(steps, i));
      else if (rating === 'good') {
        if (i + 1 >= steps.length) toReview(re ? Math.max(1, c.interval) : cfg.graduate);
        else toStep(steps, i + 1, steps[i + 1]);
      } else toReview(re ? Math.max(1, c.interval) + 1 : cfg.easyGraduate);
      return out;
    }

    const ivl = Math.max(1, c.interval);
    if (rating === 'again') {
      out.lapses = c.lapses + 1;
      out.ease = Math.max(cfg.minEase, round2(c.ease - 0.2));
      out.interval = Math.max(1, Math.round(ivl * cfg.lapseMult));   // 다시 배운 뒤 쓸 간격
      out.state = 'relearning';
      toStep(cfg.relearnSteps, 0, cfg.relearnSteps[0]);
      return out;
    }
    // 어려움 < 알맞음 < 쉬움 순서가 뒤집히지 않게 최소 하루씩 차이를 둠
    const hard = Math.max(ivl + 1, Math.round(ivl * cfg.hardMult));
    const good = Math.max(hard + 1, Math.round(ivl * c.ease));
    const easy = Math.max(good + 1, Math.round(ivl * c.ease * cfg.easyBonus));
    if (rating === 'hard') { out.ease = Math.max(cfg.minEase, round2(c.ease - 0.15)); toReview(hard); }
    else if (rating === 'good') toReview(good);
    else { out.ease = round2(c.ease + 0.15); toReview(easy); }
    return out;
  }
  const round2 = x => Math.round(x * 100) / 100;

  // 버튼별 다음 복습까지 남은 시간(ms). 복습으로 넘어가는 경우는 간격(일) 기준
  function previewIntervals(card, now, opts = {}){
    const r = {};
    RATINGS.forEach(k => { const n = schedule(card, k, now, opts); r[k] = n.state === 'review' ? n.interval * DAY : n.due - now; });
    return r;
  }
  function formatInterval(ms){
    const trim = x => x.toFixed(1).replace(/\.0$/, '');
    if (ms < HOUR) return Math.max(1, Math.round(ms / MIN)) + '분';
    if (ms < DAY) return Math.round(ms / HOUR) + '시간';
    const d = ms / DAY;
    if (d < 30) return Math.round(d) + '일';
    if (d < 365) return trim(d / 30) + '개월';
    return trim(d / 365) + '년';
  }

  // 오늘 할 카드. items: [{ id, card(없으면 새 카드), after? }] 단어 순서대로
  //   after: 반대 방향 카드(뜻→단어)일 때 짝인 단어→뜻 카드. 짝을 전날까지 한 번 이상 봐야 새 카드로 나옴
  // limits: { newLeft, reviewLeft, sameDay } 오늘 남은 새 카드·복습 개수, sameDay면 짝을 오늘 봤어도 나옴
  function buildQueue(items, now, limits, cfg = CFG){
    const ds = dayStart(now, cfg), tomorrow = addDays(ds, 1);
    const learnDue = [], learnLater = [], review = [], fresh = [], freshRev = [];
    items.forEach(it => {
      const c = it.card;
      if (!c || c.state === 'new') {
        if (!('after' in it)) fresh.push(it.id);
        else if (it.after && it.after.state !== 'new' && ((it.after.firstAt || 0) < ds || limits.sameDay)) freshRev.push(it.id);
      }
      else if (c.state === 'review') { if (c.due <= now) review.push(it); }
      else if (c.due <= now) learnDue.push(it);
      else if (c.due < tomorrow) learnLater.push(it);
    });
    const byDue = (a, b) => a.card.due - b.card.due;
    learnDue.sort(byDue); learnLater.sort(byDue); review.sort(byDue);
    const ahead = learnLater.filter(it => it.card.due - now <= cfg.learnAhead * MIN);
    // 새 카드: 반대 방향과 새 단어를 번갈아
    const mixed = [];
    for (let i = 0; i < Math.max(fresh.length, freshRev.length); i++) { if (i < freshRev.length) mixed.push(freshRev[i]); if (i < fresh.length) mixed.push(fresh[i]); }
    return {
      learn: learnDue.map(it => it.id),
      review: review.slice(0, Math.max(0, limits.reviewLeft)).map(it => it.id),
      fresh: mixed.slice(0, Math.max(0, limits.newLeft)),
      ahead: ahead.map(it => it.id),                     // 할 게 없을 때 당겨 올 학습 카드
      later: learnLater.length,                          // 오늘 안에 다시 나올 학습 카드 수
      nextAt: learnLater.length ? learnLater[0].card.due : 0,
    };
  }
  return { CFG, RATINGS, MIN, DAY, dayStart, addDays, newCard, schedule, previewIntervals, formatInterval, buildQueue };
})();
/* SRS-END */

function fillDefaults(d){
  d.settings = Object.assign({ lang: 'en-US', rate: 0.9, currentDeck: 'all', newPerDay: 20, revPerDay: 200, srsDir: 'both' }, d.settings || {});
  if (!Array.isArray(d.cardStates)) d.cardStates = [];
  // 카드 방향 기본값을 양방향으로 (예전 기본값 '단어 → 뜻'만 쓰던 기기는 한 번 바꿔 줌)
  if (d.settings.srsDirV !== 2) { if (d.settings.srsDir === 'term') d.settings.srsDir = 'both'; d.settings.srsDirV = 2; }
  if (!Array.isArray(d.groups)) d.groups = [];
  if (!Array.isArray(d.days)) d.days = [];
  d.groups.forEach(g => {
    // 지워진 단어장은 그룹에서도 뺌 (실제로 바뀔 때만 고쳐서 불필요한 동기화를 막음)
    const ids = (g.deckIds || []).filter(id => d.decks.some(x => x.id === id));
    if (!Array.isArray(g.deckIds) || ids.length !== g.deckIds.length) { g.deckIds = ids; g.updatedAt = Date.now(); }
    if (typeof g.examDate !== 'string') g.examDate = '';
  });
  d.decks.forEach(dk => { if (!dk.lang) dk.lang = d.settings.lang || 'en-US'; });
  d.words.forEach(w => {
    w.box = Number.isFinite(w.box) ? w.box : 0;
    w.nextReview = Number.isFinite(w.nextReview) ? w.nextReview : Date.now();
    w.correct = w.correct || 0; w.wrong = w.wrong || 0;
    w.example = w.example || '';
  });
  // currentDeck: 'all' | 단어장 id | 'multi'(selectedDecks에 고른 여러 단어장)
  if (d.settings.currentDeck === 'multi') {
    const ids = (d.settings.selectedDecks || []).filter(id => d.decks.some(x => x.id === id));
    d.settings.selectedDecks = ids;
    d.settings.currentDeck = ids.length >= 2 ? 'multi' : ids.length === 1 ? ids[0] : 'all';
  } else if (String(d.settings.currentDeck).startsWith('group:')) {
    if (!d.groups.some(g => 'group:' + g.id === d.settings.currentDeck)) d.settings.currentDeck = 'all';
  } else if (d.settings.currentDeck === 'unknown') d.settings.currentDeck = 'unk:all';
  else if (String(d.settings.currentDeck).startsWith('unk:')) {
    const base = d.settings.currentDeck.slice(4);
    const ok = base === 'all' || d.decks.some(x => x.id === base) || (base.startsWith('group:') && d.groups.some(g => 'group:' + g.id === base));
    if (!ok) d.settings.currentDeck = 'unk:all';
  } else if (!['all'].includes(d.settings.currentDeck) && !d.decks.some(x => x.id === d.settings.currentDeck)) d.settings.currentDeck = 'all';
  return d;
}

let db = Store.load();
db = fillDefaults(validData(db) ? db : sampleData());

let saveTimer = null, saveWarned = false;
function doSave(){
  saveTimer = null;
  if (!Store.save(db) && !saveWarned && !Sync.user) { saveWarned = true; toast('이 화면에서는 저장이 되지 않아요. 설정의 백업으로 내용을 옮겨 두세요.', 4500); }
  Sync.noteOffline();
  Sync.push();
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 250); }
function flushSave(){ if (saveTimer) { clearTimeout(saveTimer); doSave(); } }
// 앱을 닫거나 다른 앱으로 넘어갈 때 바로 저장
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });

/* ============================================================
   서버 동기화 (Firebase)
   - 화면은 언제나 이 기기의 db(메모리 + localStorage)로 바로 그림
   - 로그인하면 단어장·단어를 문서 하나씩 서버에 올리고, 다른 기기의 변경을 실시간으로 받음
   - 바뀐 문서만 올림: 마지막으로 서버와 맞춘 상태(synced)와 지금 db를 비교
   - 인터넷이 끊겨도 쓰기는 기기에 쌓였다가 연결되면 자동으로 올라감 (Firestore 오프라인 저장소)
   Firebase와 직접 이야기하는 부분은 firebase-sync.js(어댑터)에 있고,
   여기서는 어댑터가 넘겨주는 함수만 씁니다.
   ============================================================ */
const LINK_KEY = 'vocab-sync-uid';
const KINDS = ['decks', 'words', 'groups', 'days', 'cardStates'];
// 없어도 단어 동기화에는 지장 없는 목록: 서버가 거부하면 이 기기에만 두고 나머지는 계속 동기화
const OPTIONAL_KINDS = ['days', 'cardStates'];
// cardStates: 간격 반복 학습 상태. 문서 id = 단어 id. 새 단어는 문서가 없고 처음 채점할 때 생김
const CARD_KEYS = ['state', 'due', 'interval', 'ease', 'step', 'reps', 'lapses', 'lastReviewedAt', 'firstAt', 'updatedAt'];
// days: 날짜별 학습 기록. 문서 id가 날짜(2026-11-15), 모드별 푼 문제 수를 담음
const DAY_KEYS = ['cards', 'dict', 'mean', 'quiz', 'srs', 'srsNew', 'srsOk', 'updatedAt'];
const DECK_KEYS = ['name', 'lang', 'createdAt', 'updatedAt'];
const GROUP_KEYS = ['name', 'examDate', 'deckIds', 'createdAt', 'updatedAt'];
const WORD_KEYS = ['deckId', 'term', 'meaning', 'example', 'note', 'box', 'nextReview', 'correct', 'wrong', 'unknown', 'createdAt', 'updatedAt'];
const pickDoc = (kind, o) => { const keys = kind === 'decks' ? DECK_KEYS : kind === 'groups' ? GROUP_KEYS : kind === 'days' ? DAY_KEYS : kind === 'cardStates' ? CARD_KEYS : WORD_KEYS; const r = {}; keys.forEach(k => { if (o[k] !== undefined) r[k] = o[k]; }); return r; };
const docKey = (kind, id) => kind + '/' + id;
// 바뀐 것만 받기: 기기마다 '어디까지 받았는지(since)'를 기억해 두고, 다음에 열 때 그 뒤로 바뀐 문서만 받음
const META_KEY = 'vocab-sync-meta';          // { v, uid, since, fullAt, cleanedAt, pend: { 'words/id': 'set' | 'del' } }
const META_V = 3;                            // 동기화 방식이 바뀌면 올림 → 기기마다 전체를 한 번 다시 받음
const ADAPTER_V = 3;                         // firebase-sync.js가 이 버전 이상이어야 바뀐 것만 받기를 씀
const SYNC_MARGIN = 60 * 60000;              // 기기 시계와 서버 시계 차이를 감안해 1시간 겹쳐서 받음
const FULL_EVERY = 7 * 86400000;             // 안전망: 일주일에 한 번은 전체를 다시 받아 서버와 완전히 맞춤
const FULL_AFTER = 4 * 86400000;             // 4일 넘게 서버와 못 맞춘 기기는 전체를 다시 받음
const TOMB_KEEP = 5 * 86400000;              // 지움 표시는 5일 보관 후 정리
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

const Sync = {
  configured: !!window.VOCAB_FIREBASE_CONFIG,
  adapter: null,            // firebase-sync.js가 붙여 줌
  loadFailed: false,
  user: null,               // { uid, email }
  phase: 'off',             // off | waiting(서버 첫 응답 기다림) | choose(합치기 질문 중) | live
  mode: null,               // 'first'(이 기기 첫 연결) | 'resume'(이미 연결된 기기, 전체 받기) | 'delta'(바뀐 것만 받기)
  meta: null,               // META_KEY에 저장되는 이 기기의 동기화 기록
  serverAt: {},             // 목록별로 서버와 마지막으로 맞춘 시각 (이 기기 시계)
  pendGen: {},              // 올린 뒤 확인을 기다리는 문서 → 몇 번째 올리기였는지
  tombed: new Set(),        // 이번에 지운 문서 (다시 살릴 때 지움 표시를 걷기 위함)
  synced: new Map(),        // 서버와 맞춘 상태: 'words/id' → JSON
  mine: new Map(),          // 이 탭이 쓴 내용: 'words/id' → Set(JSON | '∅'(삭제)). 되돌아온 내 쓰기를 알아보는 데 씀
  remote: Object.fromEntries(KINDS.map(k => [k, new Map()])),   // 서버(와 Firestore 캐시)가 보는 상태
  off: {},                  // OPTIONAL_KINDS 중 서버가 거부한 목록 (이 기기에만 둠)
  seen: Object.fromEntries(KINDS.map(k => [k, null])), // 받은 스냅샷: null | 'cache' | 'server'
  cacheUsable: null,        // resume: 기기 저장소만으로 시작해도 되는지
  baseline: null,           // resume: 시작 때 localStorage에 있던 상태 (그사이 바뀐 것을 찾기 위함)
  unsub: [],
  inflight: 0,
  online: navigator.onLine,
  error: '',
  stamp: 0,                 // 로그인할 때마다 올라감 (이전 리스너의 늦은 응답 무시)

  attach(adapter){
    this.adapter = adapter;
    adapter.onUser(u => this.onUser(u));
    this.changed(true);
  },
  failed(){ this.loadFailed = true; this.changed(true); },

  /* ---- 로그인 상태 ---- */
  onUser(u){
    this.stop();
    this.user = u ? { uid: u.uid, email: u.email || '' } : null;
    this.error = '';
    if (!u) { this.phase = 'off'; this.changed(true); return; }
    this.meta = this.loadMeta(u.uid);
    const linked = lsGet(LINK_KEY) === u.uid;
    // 이 기기가 최근(4일 안)에 서버와 맞춘 적이 있으면 바뀐 것만, 아니면 전체를 받음
    const fresh = this.meta.since && Date.now() - this.meta.since < FULL_AFTER && Date.now() - (this.meta.fullAt || 0) < FULL_EVERY;
    if (linked && fresh && this.adapter.version >= ADAPTER_V) {
      this.mode = 'delta';
      this.start(this.meta.since - SYNC_MARGIN);
      this.goLiveDelta();
      return;
    }
    this.mode = linked ? 'resume' : 'first';
    this.phase = 'waiting';
    this.baseline = this.mode === 'resume' ? snapshotMap() : null;
    this.start();
    this.changed(true);
  },
  loadMeta(uid){
    let m = null;
    try { m = JSON.parse(lsGet(META_KEY) || 'null'); } catch (e) {}
    if (!m || m.uid !== uid) m = { v: META_V, uid, since: 0, fullAt: 0, cleanedAt: 0, pend: {} };
    if (!m.pend || typeof m.pend !== 'object') m.pend = {};
    if (m.v !== META_V) { m.v = META_V; m.since = 0; m.fullAt = 0; }   // 예전 방식으로 맞춘 기록은 버리고 전체를 한 번 받음
    return m;
  },
  saveMeta(){ if (this.meta) lsSet(META_KEY, JSON.stringify(this.meta)); },
  // 바뀐 것만 받기로 시작: 이 기기에 저장된 단어장을 그대로 쓰고 곧바로 동기화 시작
  goLiveDelta(){
    const s = snapshotMap();
    // 지난번에 올렸지만 서버 확인을 못 받은 것은 다시 올림 (같은 내용을 두 번 써도 결과는 같음)
    Object.entries(this.meta.pend).forEach(([k, how]) => { if (how === 'del') s.set(k, '"-"'); else s.delete(k); });
    this.synced = s;
    this.phase = 'live'; this.baseline = null;
    if (!db.decks.length) db.decks.push({ id: uid(), name: '내 단어장', lang: 'en-US', createdAt: Date.now(), updatedAt: Date.now() });
    this.push();
    ReviewLog.flush();
    this.changed(true);
  },
  stop(){
    if (this.phase === 'live') this.offBase = snapshotMap();
    this.unsub.forEach(f => { try { f(); } catch (e) {} });
    this.unsub = []; this.stamp++;
    this.phase = 'off'; this.synced = new Map(); this.mine = new Map(); this.baseline = null;
    this.remote = Object.fromEntries(KINDS.map(k => [k, new Map()]));
    this.seen = Object.fromEntries(KINDS.map(k => [k, null]));
    this.off = {};
    this.cacheUsable = null;
    this.meta = null; this.serverAt = {}; this.pendGen = {}; this.marked = false; this.tombed = new Set();
  },
  // 동기화가 꺼져 있는 동안(로그아웃했거나 연결부를 못 불러온 때) 바뀐 것을 기억해 두었다가, 다시 연결되면 올림
  noteOffline(){
    if (this.phase !== 'off') return;
    const linked = lsGet(LINK_KEY); if (!linked) return;   // 계정에 연결한 적 있는 기기만
    const now = snapshotMap(), base = this.offBase || now;
    const meta = this.loadMeta(linked); let ch = false;
    now.forEach((json, key) => { if (base.get(key) !== json) { meta.pend[key] = 'set'; ch = true; } });
    base.forEach((json, key) => { if (!now.has(key)) { meta.pend[key] = 'del'; ch = true; } });
    this.offBase = now;
    if (ch) lsSet(META_KEY, JSON.stringify(meta));
  },
  // since가 있으면 그 뒤로 바뀐 것만 받고, 지움 표시(deletions)도 함께 받음
  listenKinds(){ return this.since ? [...KINDS, 'deletions'] : KINDS; },
  start(since){
    const stamp = this.stamp, uid = this.user.uid;
    this.since = since || 0;
    this.listenKinds().forEach(kind => {
      if (!this.remote[kind]) this.remote[kind] = new Map();
      const optional = OPTIONAL_KINDS.includes(kind) || kind === 'deletions';
      const offKind = err => { this.off[kind] = true; console.warn(kind + ' sync off', err); this.onSnap(kind, { fromCache: false, changes: [] }); };
      try { this.unsub.push(this.adapter.listen(uid, kind,
        snap => { if (stamp === this.stamp) this.onSnap(kind, snap); },
        err => {
          if (stamp !== this.stamp) return;
          // 학습 기록은 없어도 되는 정보: 이 목록만 막혀 있으면 빈 것으로 치고 단어 동기화는 그대로 진행
          if (kind === 'deletions' && this.meta) { this.meta.since = 0; this.saveMeta(); }   // 지움 표시를 못 받으면 다음엔 전체 받기
          if (optional) { offKind(err); return; }
          this.fail(err);
        }, this.since)); }
      catch (err) { if (optional) setTimeout(() => { if (stamp === this.stamp) offKind(err); }, 0); else throw err; }
    });
  },

  restartDelta(){
    if (this.since || !(this.adapter.version >= ADAPTER_V) || !this.meta || !this.meta.since) return;   // 예전 연결부면 계속 전체 받기
    this.unsub.forEach(f => { try { f(); } catch (e) {} });
    this.unsub = []; this.stamp++;
    this.start(this.meta.since - SYNC_MARGIN);
  },
  // 모든 목록이 서버와 맞으면: 기록해 두고, 하루 한 번 오래된 지움 표시를 정리
  noteServer(kind, snap){
    if (snap.fromCache || this.phase !== 'live' || !this.meta) return;
    this.serverAt[kind] = Date.now();
    this.evalServer();
  },
  evalServer(){
    if (this.phase !== 'live' || !this.meta) return;
    const kinds = this.listenKinds().filter(k => !this.off[k]);
    if (!kinds.every(k => this.serverAt[k])) return;
    const t = Math.min(...kinds.map(k => this.serverAt[k]));
    if (t > (this.meta.since || 0)) { this.meta.since = t; clearTimeout(this._metaT); this._metaT = setTimeout(() => this.saveMeta(), 1000); }
    if (!this.marked) {
      this.marked = true;
      if (this.mode !== 'delta') { this.meta.fullAt = Date.now(); this.saveMeta(); this.restartDelta(); }
      this.cleanupTombs();
    }
  },
  cleanupTombs(){
    if (!this.adapter.cleanup || Date.now() - (this.meta.cleanedAt || 0) < 86400000) return;
    const uidv = this.user.uid, stamp = this.stamp;
    this.adapter.cleanup(uidv, Date.now() - TOMB_KEEP)
      .then(n => { if (this.meta && this.user && this.user.uid === uidv) { this.meta.cleanedAt = Date.now(); this.saveMeta(); if (n) console.info('지움 표시 정리', n); } })
      .catch(err => console.warn('지움 표시 정리 실패', err));
  },

  /* ---- 서버에서 받은 변경 ---- */
  onSnap(kind, snap){
    // snap: { fromCache, changes: [{ type: 'added'|'modified'|'removed', id, data, pending }] }
    if (kind === 'deletions') {
      if (this.seen[kind] !== 'server') this.seen[kind] = snap.fromCache ? 'cache' : 'server';
      if (this.phase === 'live') this.applyDeletions(snap.changes);
      this.noteServer(kind, snap);
      return;
    }
    const map = this.remote[kind];
    snap.changes.forEach(c => { if (c.type === 'removed') map.delete(c.id); else map.set(c.id, c.data); });
    if (this.seen[kind] !== 'server') this.seen[kind] = snap.fromCache ? 'cache' : 'server';
    this.online = !snap.fromCache || navigator.onLine;

    if (this.phase === 'live') { this.applyChanges(kind, snap.changes); this.noteServer(kind, snap); this.changed(); return; }
    if (this.phase !== 'waiting') return;
    const bothServer = KINDS.every(k => this.seen[k] === 'server');
    const bothAny = KINDS.every(k => this.seen[k]);
    if (this.mode === 'first') {
      // 첫 연결은 서버의 실제 상태를 보고 결정해야 해서 서버 응답을 기다림
      if (bothServer) this.firstLink();
      else this.changed();
    } else {
      // 이미 연결된 기기: 기기 저장소(캐시)에 데이터가 있으면 바로 시작하고, 비어 있으면 두 목록 모두 서버 응답을 기다림
      // (판단은 두 목록이 처음 다 도착한 순간 한 번만. 한쪽만 서버에서 먼저 와도 섣불리 시작하지 않게)
      if (bothAny && this.cacheUsable === null) this.cacheUsable = !!(this.remote.decks.size || this.remote.words.size);   // 그룹은 없어도 됨
      if (bothServer || (bothAny && this.cacheUsable)) this.resume();
      else this.changed();
    }
  },
  applyChanges(kind, changes){
    flushSave();   // 아직 안 올린 이 기기 변경이 덮이지 않게 먼저 올림
    let dirty = false, repush = false;
    if (!db[kind]) db[kind] = [];
    const list = db[kind];
    changes.forEach(c => {
      const key = docKey(kind, c.id);
      // 아직 서버가 확인하지 않은 변경(pending) 중 이 탭이 쓴 것은 무시.
      // 같은 브라우저의 다른 탭은 저장소를 함께 써서 그 탭의 쓰기도 pending으로 보이므로, 내 것이 아니면 반영함
      const sig = c.type === 'removed' ? '∅' : JSON.stringify(pickDoc(kind, c.data));
      const mine = this.mine.get(key);
      if (c.pending) { if (mine && mine.has(sig)) return; }
      else if (mine) this.mine.delete(key);   // 서버가 확인함
      const idx = list.findIndex(x => x.id === c.id);
      if (c.type === 'removed') {
        if (this.since) return;   // 바뀐 것만 받을 때는 지움 표시(deletions)로만 지움
        this.synced.delete(key);
        if (idx >= 0) { list.splice(idx, 1); dirty = true; }
        return;
      }
      const json = JSON.stringify(pickDoc(kind, c.data));
      const local = idx >= 0 ? JSON.stringify(pickDoc(kind, list[idx])) : null;
      this.synced.set(key, json);
      if (json === local) return;
      // 학습 상태: 이 기기 쪽이 더 나중에 채점됐으면 이 기기 것을 남기고 다시 올림
      if (kind === 'cardStates' && idx >= 0 && (list[idx].updatedAt || 0) > (c.data.updatedAt || 0)) { repush = true; return; }
      const item = Object.assign({ id: c.id }, pickDoc(kind, c.data));
      if (idx >= 0) list[idx] = item; else list.push(item);
      dirty = true;
    });
    if (dirty) afterRemoteData();
    if (repush) this.push();
  },

  // 다른 기기에서 지운 것: 지운 뒤에 이 기기에서 다시 고친 것이 아니면 지움
  applyDeletions(changes){
    let dirty = false, repush = false;
    changes.forEach(c => {
      if (c.type === 'removed' || !c.data || !KINDS.includes(c.data.kind)) return;
      const { kind, id, at } = c.data, list = db[kind] || [], key = docKey(kind, id);
      const idx = list.findIndex(x => x.id === id);
      if (this.meta && this.meta.pend[key] === 'set') return;   // 이 기기에서 살려서 올리는 중
      if (idx >= 0 && (list[idx].updatedAt || 0) > (at || 0)) {
        // 다른 기기가 지운 뒤에 이 기기에서 고친 것: 서버에서는 이미 지워졌으니 다시 올리고 지움 표시를 걷음
        this.synced.delete(key); this.tombed.add(key); repush = true;
        return;
      }
      this.synced.delete(key);
      if (idx >= 0) { list.splice(idx, 1); dirty = true; }
    });
    if (dirty) afterRemoteData();
    if (repush) this.push();
  },

  /* 이 기기를 처음 계정에 연결할 때 */
  firstLink(){
    const cloudEmpty = KINDS.every(k => !this.remote[k].size);
    const localWords = db.words.length;
    if (cloudEmpty) {
      this.goLive(new Map());        // 서버가 비어 있음 → 이 기기 단어를 모두 올림
      if (localWords) toast(`이 기기의 단어 ${localWords}개를 계정에 올렸어요`, 3200);
    } else if (!localWords) {
      this.useCloud(); this.goLive();
      toast('계정의 단어장을 불러왔어요');
    } else {
      this.phase = 'choose';
      this.changed();
      openSheet(`
        <h2 style="font-size:20px">이 기기의 단어를 어떻게 할까요?</h2>
        <p>계정에 이미 단어 <b class="num">${this.remote.words.size}</b>개가 있고, 이 기기에도 단어 <b class="num">${localWords}</b>개가 있어요.</p>
        <dl class="optlist">
          <dt>합치기</dt><dd>두 쪽 단어를 모두 남겨요. 같은 단어를 양쪽에서 고쳤다면 최근에 고친 쪽을 남겨요.</dd>
          <dt>계정 것만 쓰기</dt><dd>이 기기의 단어는 지우고 계정의 단어장으로 바꿔요. 이 기기에는 예시 단어장만 있었다면 이쪽을 고르세요.</dd>
        </dl>
        <div class="row end">
          <button class="btn" data-action="sync-choose" data-how="cloud">계정 것만 쓰기</button>
          <button class="btn primary" data-action="sync-choose" data-how="merge">합치기</button>
        </div>`);
      $('sheet').dataset.lock = '1';   // 고를 때까지 바깥을 눌러도 닫히지 않게
    }
  },
  choose(how){
    if (this.phase !== 'choose') return;
    delete $('sheet').dataset.lock; closeSheet();
    if (how === 'cloud') {
      this.useCloud(); this.goLive();
      toast('계정의 단어장으로 바꿨어요');
    } else {
      KINDS.forEach(k => { db[k] = mergeLists(k, db[k] || [], this.remote[k]); });
      this.goLive();
      toast('두 쪽 단어를 합쳤어요');
    }
  },
  // 이미 연결된 기기를 다시 열었을 때: 서버 상태를 기준으로 하되, 그사이 이 기기에서 바꾼 것은 살림
  resume(){
    const local = this.baseline || new Map();
    const now = snapshotMap();
    const edits = [];
    now.forEach((json, key) => { if (local.get(key) !== json) edits.push([key, json]); });
    local.forEach((json, key) => { if (!now.has(key)) edits.push([key, null]); });
    // 지난번에 올렸지만 서버 확인을 못 받은 것도 이 기기 쪽을 남김
    Object.entries((this.meta && this.meta.pend) || {}).forEach(([key, how]) => {
      if (edits.some(e => e[0] === key)) return;
      if (how === 'del') { if (!now.has(key)) edits.push([key, null]); }
      else if (now.has(key)) edits.push([key, now.get(key)]);
    });
    this.useCloud();
    edits.forEach(([key, json]) => {
      const [kind, id] = key.split('/'); const list = db[kind]; const idx = list.findIndex(x => x.id === id);
      if (json === null) { if (idx >= 0) list.splice(idx, 1); return; }
      const item = Object.assign({ id }, JSON.parse(json));
      if (idx >= 0) list[idx] = item; else list.push(item);
    });
    this.goLive();
  },
  useCloud(){
    KINDS.forEach(k => { db[k] = [...this.remote[k]].map(([id, d]) => Object.assign({ id }, pickDoc(k, d))); });
  },
  goLive(synced){
    this.synced = synced || remoteSynced();
    this.phase = 'live'; this.baseline = null;
    lsSet(LINK_KEY, this.user.uid);
    if (!db.decks.length) db.decks.push({ id: uid(), name: '내 단어장', lang: 'en-US', createdAt: Date.now(), updatedAt: Date.now() });
    afterRemoteData();
    this.push();
    ReviewLog.flush();
    // 기다리는 동안 이미 서버에서 받은 목록은 맞춘 것으로 기록
    KINDS.forEach(k => { if (this.seen[k] === 'server') this.serverAt[k] = Date.now(); });
    this.evalServer();
    this.changed(true);
  },

  /* ---- 이 기기의 변경을 서버로 ---- */
  push(){
    if (this.phase !== 'live' || !this.adapter || !this.user) return;
    const ops = [];
    const now = snapshotMap();
    let bumped = false;
    now.forEach((json, key) => {
      const was = this.synced.get(key);
      if (was === json) return;
      const [kind, id] = key.split('/');
      if (this.off[kind]) return;
      // 내용이 바뀌었는데 updatedAt이 그대로면 올려 줌 (다른 기기의 '나중에 고친 쪽 남기기'가 맞게 동작하도록)
      let data = JSON.parse(json);
      let prevAt = 0; try { prevAt = was && was !== '"-"' ? (JSON.parse(was).updatedAt || 0) : 0; } catch (e) {}
      if (!data.updatedAt || data.updatedAt <= prevAt) {
        const item = (db[kind] || []).find(x => x.id === id);
        if (item) { item.updatedAt = Math.max(Date.now(), prevAt + 1); data = pickDoc(kind, item); bumped = true; }
      }
      ops.push({ kind, id, data, track: true, untomb: this.tombed.has(key) || !!(this.meta && this.meta.pend[key] === 'del') || was === '"-"' });
      this.tombed.delete(key);
    });
    this.synced.forEach((json, key) => {
      if (now.has(key)) return;
      const [kind, id] = key.split('/');
      if (this.off[kind]) return;
      ops.push({ kind, id, data: null, track: true });
      this.tombed.add(key);   // 이번에 지운 것: 다시 살리면 지움 표시도 걷음
    });
    if (bumped) Store.save(db);
    if (!ops.length) return;
    // 서버 확인을 받을 때까지 기억 (앱이 꺼져도 다음에 다시 올리도록)
    const gen = this.pendGen._n = (this.pendGen._n || 0) + 1;
    if (this.meta) { ops.forEach(o => { const k = docKey(o.kind, o.id); this.meta.pend[k] = o.data ? 'set' : 'del'; this.pendGen[k] = gen; }); this.saveMeta(); }
    ops.forEach(o => {
      const k = docKey(o.kind, o.id), json = o.data ? JSON.stringify(o.data) : null;
      json ? this.synced.set(k, json) : this.synced.delete(k);
      if (!this.mine.has(k)) this.mine.set(k, new Set());
      this.mine.get(k).add(json || '∅');
    });
    const stamp = this.stamp;
    this.inflight++; this.changed();
    const meta = this.meta;
    this.adapter.commit(this.user.uid, ops)
      .then(() => {
        if (meta && meta === this.meta) {
          ops.forEach(o => { const k = docKey(o.kind, o.id); if (this.pendGen[k] === gen) { delete meta.pend[k]; delete this.pendGen[k]; } });
          this.saveMeta();
        }
        if (stamp === this.stamp) this.error = '';
      })
      .catch(err => { if (stamp === this.stamp) this.fail(err); })
      .finally(() => { this.inflight = Math.max(0, this.inflight - 1); this.changed(); });
  },
  fail(err){
    const code = (err && err.code) || '';
    this.error = code.includes('permission') ? '서버가 접근을 거부했어요. README의 보안 규칙을 확인해 주세요.'
      : '동기화 중 문제가 생겼어요. 잠시 후 앱을 다시 열어 주세요.';
    console.warn('sync error', err);
    this.changed();
  },

  /* ---- 상태 표시 ---- */
  status(){
    if (!this.configured) return { key: 'none', text: '서버 동기화가 설정되지 않았어요' };
    if (this.loadFailed) return { key: 'error', text: '동기화 기능을 불러오지 못했어요. 인터넷에 연결된 뒤 앱을 다시 열어 주세요.' };
    if (!this.adapter) return { key: 'wait', text: '동기화 준비 중…' };
    if (!this.user) return { key: 'out', text: '로그인하지 않았어요 · 이 기기에만 저장돼요' };
    if (this.error) return { key: 'error', text: this.error };
    if (this.phase === 'waiting') return { key: 'wait', text: navigator.onLine ? '서버와 맞추는 중…' : '서버에 연결되면 동기화를 시작해요' };
    if (this.phase === 'choose') return { key: 'wait', text: '이 기기의 단어를 어떻게 할지 골라 주세요' };
    if (!navigator.onLine || !this.online) return { key: 'offline', text: '오프라인 · 연결되면 자동으로 올라가요' };
    if (this.inflight) return { key: 'busy', text: '올리는 중…' };
    return { key: 'ok', text: '모든 기기와 동기화됨' };
  },
  changed(authChanged){
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      const st = this.status();
      document.querySelectorAll('[data-sync-status]').forEach(el => { el.textContent = st.text; el.dataset.state = st.key; });
      document.querySelectorAll('[data-sync-dot]').forEach(el => { el.dataset.state = st.key; el.title = st.text; });
      if (authChanged && (view === 'settings' || (view === 'words' && !deckOpen))) safeRender();
    }, 30);
  }
};

function snapshotMap(){
  const m = new Map();
  KINDS.forEach(k => (db[k] || []).forEach(x => m.set(docKey(k, x.id), JSON.stringify(pickDoc(k, x)))));
  return m;
}
function remoteSynced(){
  const m = new Map();
  KINDS.forEach(kind => Sync.remote[kind].forEach((d, id) => m.set(docKey(kind, id), JSON.stringify(pickDoc(kind, d)))));
  return m;
}
// 합치기: id가 같으면 updatedAt이 더 최근인 쪽
function mergeLists(kind, localList, remoteMap){
  const out = new Map();
  remoteMap.forEach((d, id) => out.set(id, Object.assign({ id }, pickDoc(kind, d))));
  localList.forEach(x => {
    const r = out.get(x.id);
    if (!r || (x.updatedAt || 0) > (r.updatedAt || 0)) out.set(x.id, Object.assign({ id: x.id }, pickDoc(kind, x)));
  });
  return [...out.values()];
}

// 모르는 단어 표시: 표시할 때만 unknown: true를 저장하고, 해제하면 항목을 지움 (동기화 문서를 작게 유지)
function setUnknown(w, on){
  if (!w || !!w.unknown === !!on) return;
  if (on) w.unknown = true; else delete w.unknown;
  w.updatedAt = Date.now();
}
const unknownCount = () => db.words.filter(w => w.unknown).length;
// 그룹: 단어장 여러 개를 묶음 (예: 중간고사, 기말고사). 한 단어장이 여러 그룹에 들어갈 수 있음
const groupById = id => (db.groups || []).find(g => g.id === id);
const groupOf = c => String(c).startsWith('group:') ? groupById(String(c).slice(6)) : null;
function groupWords(g){ const set = new Set(g.deckIds); return db.words.filter(w => set.has(w.deckId)); }
function groupDecks(g){ return db.decks.filter(d => g.deckIds.includes(d.id)); }
// 시험 날짜까지 남은 날
function dday(date){
  if (!date) return null;
  const t = new Date(date + 'T00:00:00').getTime(); if (!Number.isFinite(t)) return null;
  const n = Math.round((t - startOfToday()) / DAY);
  return n > 0 ? { text: `D-${n}`, soon: n <= 7 } : n === 0 ? { text: 'D-day', soon: true } : { text: '시험 끝', past: true };
}
// 다가오는 시험 순 → 날짜 없는 그룹 → 지난 시험
function sortedGroups(){
  const rank = g => { const d = dday(g.examDate); return !d ? 1 : d.past ? 2 : 0; };
  return [...(db.groups || [])].sort((a, b) => rank(a) - rank(b) || (a.examDate || '').localeCompare(b.examDate || '') || a.createdAt - b.createdAt);
}
const isDue = w => w.nextReview <= endOfToday();
const deckById = id => db.decks.find(d => d.id === id);
const wordById = id => db.words.find(w => w.id === id);
// 범위: 'all' | 단어장 id | 'multi' | 'group:<id>' | 'unk:<범위>'(그 범위의 모르는 단어만, 예: 'unk:all', 'unk:<단어장 id>')
const isUnkScope = c => String(c).startsWith('unk:');
const unkBase = c => String(c).slice(4);
function scopeWords(c){
  if (isUnkScope(c)) return scopeWords(unkBase(c)).filter(w => w.unknown);
  if (c === 'all') return db.words;
  if (c === 'multi') { const set = new Set(db.settings.selectedDecks); return db.words.filter(w => set.has(w.deckId)); }
  const g = groupOf(c); if (g) return groupWords(g);
  return db.words.filter(w => w.deckId === c);
}
function currentWords(){ return scopeWords(db.settings.currentDeck); }
function scopeValid(c){
  if (isUnkScope(c)) return scopeValid(unkBase(c));
  if (c === 'all') return true;
  if (c === 'multi') return (db.settings.selectedDecks || []).length >= 2;
  if (String(c).startsWith('group:')) return !!groupOf(c);
  return !!deckById(c);
}
function scopeName(c){
  if (c === 'unk:all') return '모르는 단어';
  if (isUnkScope(c)) return `${scopeName(unkBase(c))} · 모르는 단어`;
  if (c === 'all') return '모든 단어';
  if (c === 'multi') return `선택한 단어장 ${(db.settings.selectedDecks || []).length}개`;
  const g = groupOf(c); if (g) return g.name;
  return deckById(c)?.name || '단어장';
}
// 날짜 키: 이 기기 시간 기준 2026-11-15
function dayKey(d = new Date()){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const dayById = id => (db.days || []).find(x => x.id === id);
const dayTotal = d => d ? (d.cards || 0) + (d.dict || 0) + (d.mean || 0) + (d.quiz || 0) + (d.srs || 0) : 0;
function logStudy(mode){
  const id = dayKey(); let d = dayById(id);
  if (!d) { d = { id }; db.days.push(d); }
  d[mode] = (d[mode] || 0) + 1; d.updatedAt = Date.now();
}
function streak(){
  let n = 0; const d = new Date();
  if (!dayTotal(dayById(dayKey(d)))) d.setDate(d.getDate() - 1);   // 오늘 아직 안 했으면 어제까지의 연속
  while (dayTotal(dayById(dayKey(d)))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
// 틀리면 모르는 단어에 넣고, 맞히면 뺌. 퀴즈는 찍어서 맞힐 수 있으니 맞혀도 빼지 않음(keepUnknown)
function grade(id, ok, keepUnknown, noLog){
  const w = wordById(id); if (!w) return;
  if (!noLog) logStudy(MODES[view] ? view : 'cards');
  if (!ok) setUnknown(w, true); else if (!keepUnknown) setUnknown(w, false);
  if (ok) {
    w.box = Math.min(w.box + 1, INTERVALS.length - 1);
    w.correct++;
    w.nextReview = startOfToday() + INTERVALS[w.box] * DAY;
  } else {
    w.box = 0; w.wrong++; w.nextReview = Date.now();
  }
  w.updatedAt = Date.now();
  save();
}
// 복습할 단어를 먼저, 나머지는 섞어서 n개
function pickSession(words, n = 10, onlyDue = false){
  const due = shuffle(words.filter(isDue));
  if (onlyDue) return due.slice(0, n).map(w => w.id);
  const rest = shuffle(words.filter(w => !isDue(w)));
  return due.concat(rest).slice(0, n).map(w => w.id);
}

const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';

// č ć đ š ž 입력 버튼을 보여 줄 언어 (크로아티아어, 세르비아어 라틴 문자)

function speak(text, rate, lang){
  if (!canSpeak) { toast('이 브라우저는 음성 재생을 지원하지 않아요'); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    lang = lang || db.settings.lang;
    u.lang = lang;
    u.rate = rate ?? db.settings.rate;
    const voices = speechSynthesis.getVoices();
    const find = code => voices.find(v => v.lang.replace('_','-').toLowerCase() === code)
                      || voices.find(v => v.lang.toLowerCase().startsWith(code.slice(0,2)));
    let v = find(lang.toLowerCase());
    // 세르비아어 음성이 없는 기기(아이폰 등)는 발음이 거의 같은 크로아티아어 음성으로 읽음
    if (!v && lang.startsWith('sr')) { v = find('hr-hr'); u.lang = 'hr-HR'; }
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { toast('음성을 재생하지 못했어요'); }
}

/* ---------- 뜻 자동 채우기 ----------
   무료 번역 API(MyMemory)로 뜻을 찾고, 영어는 사전 API(dictionaryapi.dev)로 예문과 품사를 채웁니다.
   MyMemory 무료 한도: 하루 5,000자(단어 수백 개). */
const POS_KO = { noun: '명사', verb: '동사', adjective: '형용사', adverb: '부사', pronoun: '대명사', preposition: '전치사', conjunction: '접속사', interjection: '감탄사', exclamation: '감탄사', determiner: '한정사' };

// 번역 후보가 사전 뜻으로 쓸 만한지 검사.
// 무료 번역 메모리에는 성경·자막 같은 문장 조각이 섞여 있어서 "기 도 하 라" 같은 것이 딸려 옴
function badMeaning(t){
  const toks = t.split(/\s+/);
  if (toks.length > 4) return true;                                                  // 문장
  if (toks.length >= 2 && toks.filter(x => x.length === 1).length / toks.length >= 0.6) return true;   // 글자마다 띄어 쓴 것
  if (/[^가-힣\s,·\-~]/.test(t)) return true;                                        // 한글이 아닌 글자·숫자·문장부호
  if (/(.)\1{2,}/.test(t)) return true;                                              // ㅋㅋㅋ 같은 반복
  const k = t.replace(/\s/g, '');
  if (/(하라|하소서|이니라|리라|나이다|느니라|지어다|하더라|도다|니이다)$/.test(k)) return true;   // 옛말투·명령문
  // 문장: 세 단어 이상이면서 서술형으로 끝나거나, "집이 큽니다"처럼 주어·목적어로 시작하는 두 단어.
  // "감사합니다", "안녕히 가세요" 같은 인사말은 뜻으로 쓰이므로 남김
  const ending = /(니다|요|니까|었다|았다|였다|죠)$/.test(k);
  if (ending && (toks.length >= 3 || (toks.length === 2 && /[이가은는을를]$/.test(toks[0])))) return true;
  return false;
}
function cleanMeanings(list, term){
  const out = [];
  for (let t of list) {
    t = String(t || '').normalize('NFC').trim().replace(/[.。!?]+$/, '').replace(/\s+/g, ' ');
    if (!t || t.length > 20 || norm(t) === norm(term) || !/[가-힣]/.test(t)) continue;
    if (badMeaning(t)) continue;
    if (out.some(o => meaningKey(o) === meaningKey(t))) continue;
    out.push(t);
  }
  return out.slice(0, 3);
}
// 번역 응답에서 믿을 만한 순서로 후보를 고름:
// 기계 번역 결과 → 원문이 이 단어와 정확히 같은 번역 메모리(품질·사용 횟수 순). 다른 문장에서 온 비슷한 결과는 버림
function pickCandidates(j, term){
  const key = x => norm(String(x || '').replace(/[.!?,;:"'()]/g, ''));
  const tk = key(term);
  const ms = (j.matches || []).filter(m => m && m.translation);
  const isMT = m => /^MT/i.test(String(m['created-by'] || '')) || m.id === 0 || m.id === '0';
  const mt = ms.filter(isMT);
  const tm = ms.filter(m => !isMT(m) && key(m.segment) === tk && (m.quality == null || m.quality === '' || Number(m.quality) >= 50))
    .sort((a, b) => (Number(b.quality) || 0) - (Number(a.quality) || 0) || (Number(b['usage-count']) || 0) - (Number(a['usage-count']) || 0));
  const cands = [...mt, ...tm].map(m => m.translation);
  // matches가 비어 있는 응답이면 대표 번역만 씀
  if (!ms.length && j.responseData && j.responseData.translatedText) cands.push(j.responseData.translatedText);
  return cands;
}
async function apiLookup(term, src){
  const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(term)}&langpair=${src}|ko`);
  if (!r.ok) throw { code: 'http' };
  const j = await r.json();
  if (j.quotaFinished || Number(j.responseStatus) === 429) throw { code: 'quota' };
  const cands = pickCandidates(j, term);
  let example = '', pos = '';
  if (src === 'en') {
    try {
      const d = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(term)}`);
      if (d.ok) for (const e of await d.json()) for (const m of (e.meanings || [])) {
        if (!pos) pos = POS_KO[m.partOfSpeech] || '';
        for (const df of (m.definitions || [])) if (!example && df.example) example = df.example;
      }
    } catch (e) {}
  }
  return { meanings: cleanMeanings(cands, term), example, pos };
}
// 여러 단어를 한 번에 찾아 Map(단어 → {meanings, example, pos} | null)으로 돌려줌
async function lookupMany(terms, lang, onProgress){
  const src = String(lang || 'en').slice(0, 2);
  const out = new Map(); const queue = terms.slice(); let done = 0, quota = false, okCount = 0;
  const worker = async () => {
    while (queue.length) {
      const t = queue.shift();
      if (quota) { out.set(t, null); continue; }
      try { out.set(t, await apiLookup(t, src)); okCount++; }
      catch (e) { out.set(t, null); if (e && e.code === 'quota') quota = true; }
      onProgress?.(++done, terms.length);
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  if (quota) throw { code: 'quota' };
  if (!okCount) throw { code: 'network' };
  return out;
}
function lookupErrorText(e){
  const c = e && e.code;
  if (c === 'quota') return '오늘 무료 번역 한도를 다 썼어요. 내일 다시 쓸 수 있고, 지금은 뜻을 직접 입력해 주세요';
  return '뜻을 찾지 못했어요. 인터넷 연결을 확인하거나 직접 입력해 주세요';
}

let lookSeq = 0, lastLooked = '', autoMeaning = '', autoExample = '', lookTimer = null;
function setLookState(t){ const el = $('lookState'); if (el) el.textContent = t; const b = $('lookBtn'); if (b) b.disabled = !!t; }

function currentMeaningParts(){ return $('fMeaning').value.split(',').map(x => x.trim()).filter(Boolean); }
function showSuggest(res, note){
  const box = $('suggest'); if (!box) return;

  const parts = currentMeaningParts();
  box.innerHTML = res

async function lookupSingle(auto){
  const termEl = $('fTerm'); if (!termEl) return;
  const term = termEl.value.trim();
  if (!term) { if (!auto) toast('단어를 먼저 입력해 주세요'); return; }
  const lang = deckLang($('fDeck').value);
  const key = lang + '|' + norm(term);
  if (auto && key === lastLooked) return;
  lastLooked = key;
  const seq = ++lookSeq;
  setLookState('찾는 중…');
  try {
    const res = (await lookupMany([term], lang)).get(term);
    if (seq !== lookSeq || !$('fTerm') || norm($('fTerm').value) !== norm(term)) return;
    setLookState('');
    if (!res || !res.meanings.length) { showSuggest(null, `'${term}'의 뜻을 찾지 못했어요. 철자를 확인하거나 직접 입력해 주세요.`); return; }
    const m = $('fMeaning'), ex = $('fExample');
    if (!m.value.trim() || m.value === autoMeaning) { m.value = autoMeaning = res.meanings[0]; }
    if (res.example && (!ex.value.trim() || ex.value === autoExample)) { ex.value = autoExample = res.example; }
    showSuggest(res);
    if (!auto) toast('뜻을 채웠어요. 확인하고 추가를 눌러 주세요');
  } catch (e) {
    if (seq !== lookSeq) return;

  }
}

/* ============ 2. 플래시카드 ============ */

/* ---------- 오늘의 복습 (간격 반복) ---------- */
// 카드 id: 단어→뜻은 단어 id 그대로(예전 기록과 이어짐), 뜻→단어는 단어 id + ':r'
const REV = ':r';
const cardId = (wordId, dir) => dir === 'r' ? wordId + REV : wordId;
const wid = cid => cid.endsWith(REV) ? cid.slice(0, -REV.length) : cid;
const dirOf = cid => cid.endsWith(REV) ? 'r' : 'f';

const cardState = id => db.cardStates.find(c => c.id === id);
// 시험 대비: 학습 범위가 시험 날짜가 있는 그룹이면 켜짐
function examInfo(now = Date.now()){
  const g = groupOf(db.settings.currentDeck);
  if (!g || !/^\d{4}-\d{2}-\d{2}$/.test(g.examDate || '')) return null;
  const [y, m, d] = g.examDate.split('-').map(Number);
  const examAt = new Date(y, m - 1, d, SRS.CFG.dayStartHour).getTime();
  const days = Math.round((examAt - SRS.dayStart(now)) / SRS.DAY);   // 시험까지 남은 학습일 (0이면 오늘이 시험)
  if (days < 0) return null;
  // dd: 달력 기준 남은 날 (화면 표시·총정리용, 그룹의 D-day와 같음)
  const dd = Math.round((new Date(y, m - 1, d).getTime() - startOfToday()) / DAY);
  return { g, days, dd, examAt, capAt: SRS.addDays(examAt, -1) };
}
const srsOpts = (now = Date.now()) => { const ex = examInfo(now); return ex && ex.days >= 2 ? { capAt: ex.capAt } : {}; };
// 범위 안 단어들의 카드 목록 (설정한 방향만)
function scopeCards(words){
  const map = new Map(db.cardStates.map(c => [c.id, c])), dirs = activeDirs(), out = [];
  words.slice().sort((a, b) => a.createdAt - b.createdAt).forEach(w => dirs.forEach(d => {
    const id = cardId(w.id, d), it = { id, card: map.get(id) };
    if (d === 'r' && dirs.includes('f')) it.after = map.get(w.id) || null;
    out.push(it);
  }));
  return out;
}
function srsLimits(now){
  const ds = SRS.dayStart(now);

    if ((c.firstAt || 0) >= ds) newDone++;
    else if ((c.lastReviewedAt || 0) >= ds) revDone++;

  return { newLeft: db.settings.newPerDay - newDone, reviewLeft: db.settings.revPerDay - revDone };
}
// 학습 중 카드가 돌아올 시각에 맞춰 학습 탭·복습 완료 화면을 새로 그림
let srsTimer = null;
function srsWake(q, now){

}
function srsQueue(now = Date.now()){
  const items = scopeCards(currentWords()), lim = srsLimits(now), ex = examInfo(now);
  if (ex && ex.days >= 1) {
    // 남은 새 카드를 시험 이틀 전까지 나눠서 (하루 새 카드 수보다 적어지지는 않음)
    const ds = SRS.dayStart(now);
    let left = 0, today = 0;
    items.forEach(it => { if (!it.card || it.card.state === 'new') left++; else if ((it.card.firstAt || 0) >= ds) today++; });
    const finish = Math.max(1, ex.days - 2);
    lim.newLeft = Math.max(lim.newLeft, Math.ceil((left + today) / finish) - today);
    lim.reviewLeft = Infinity;           // 시험 전에는 복습 개수 제한 없음
    lim.sameDay = ex.days <= 2;          // 막바지에는 뜻→단어 카드도 같은 날 바로

// 지금 보여 줄 카드: 학습 중(때가 된 것) → 오늘 복습 → 새 단어 → 곧 돌아올 학습 카드

    ${ex.dd <= 1 ? `<button class="btn wide" data-action="exam-final">시험 전 총정리 (전체 <span class="num">${currentWords().length}</span>개)</button>` : ''}`;

function reviewCard(){
  const words = currentWords();

    // 내일 나올 새 카드: 시험 대비면 남은 새 카드를 남은 날로 나눈 몫, 아니면 하루 새 단어 수

    const newTomorrow = Math.min(newLeft, Math.max(plan, db.settings.newPerDay));
    return `<section class="panel srs done">
      <div class="srshead"><h2>오늘의 복습</h2><span class="ok">오늘 복습 완료</span></div>
      ${examLine(q)}
      <p class="hintline">${q.later ? `학습 중 카드 <b class="num">${q.later}</b>개가 ${SRS.formatInterval(q.nextAt - now)} 뒤에 다시 나와요 · ` : ''}내일 예정: 복습 <b class="num">${tomorrow}</b> · 새 카드 ${newLeft ? '약 ' : ''}<b class="num">${newTomorrow}</b></p>
    </section>`;
  }
  return `<section class="panel srs">
    <div class="srshead"><h2>오늘의 복습</h2></div>
    ${examLine(q)}
    <div class="srsnums">
      <div class="stat"><b class="num">${q.fresh.length}</b><span>새 단어</span></div>
      <div class="stat"><b class="num">${learn}</b><span>학습 중</span></div>
      <div class="stat"><b class="num">${q.review.length}</b><span>복습</span></div>
    </div>

function viewReview(){

  // 지금 카드가 다른 기기에서 채점됐거나, 지워졌거나, 범위를 벗어났으면 다음 카드로
  if (s.cur) {
    const st = cardState(s.cur);

  return `
  <div class="progress"><span class="num">${s.done} / ${total}</span><div class="bar"><i style="width:${total ? s.done / total * 100 : 0}%"></i></div>${undoBtn}</div>
  <div class="cardwrap" id="srsWrap" ${s.flipped ? '' : 'data-action="srs-show" role="button" tabindex="0" aria-label="정답 보기"'}>

      <div class="face front"><div class="head"><span>${termFirst ? '단어 → 뜻' : '뜻 → 단어'}</span><span>${label}</span></div><div class="content">${termFirst ? termFace : meaningFace}</div></div>
      <div class="face back"><div class="head"><span>${termFirst ? '단어 → 뜻' : '뜻 → 단어'}</span><span>${label}</span></div><div class="content">${termFirst ? meaningFace + `<div class="sub">${esc(w.term)}</div>` : termFace + `<div class="sub">${esc(w.meaning)}</div>`}${ex}</div></div>
    </div>

/* ---------- 채점 기록 (reviewLogs) ----------
   복습 화면에서 채점할 때마다 한 줄씩 users/{uid}/reviewLogs/{단어id_시각}에 쌓음.
   나중에 FSRS로 바꿀 때 쓰려는 기록이라 앱은 이 목록을 읽지 않음(리스너 없음, 읽기 용량 안 씀).
   보낼 기록은 먼저 이 기기에 모아 두고(오프라인·로그인 전 대비), 연결되면 올린 뒤 지움.
   문서 id가 정해져 있어 같은 기록을 두 번 보내도 한 줄로 남음. 되돌리기 한 채점은 기록에서도 지움. */
const ReviewLog = {
  KEY: 'vocab-log-outbox',
  MAX: 5000,                 // 오래 못 보내도 이 기기 저장 공간이 넘치지 않게
  box: null, busy: false,
  // 같은 브라우저의 다른 탭도 이 목록을 쓰므로 매번 저장소에서 다시 읽음
  load(){ try { this.box = JSON.parse(lsGet(this.KEY) || '[]'); } catch (e) { this.box = []; } if (!Array.isArray(this.box)) this.box = []; return this.box; },
  sig: x => x.id + (x.data ? '' : '#del'),
  keep(){ lsSet(this.KEY, this.box.length ? JSON.stringify(this.box) : null); },
  add(id, data){
    if (!Sync.configured) return;          // 계정 연결 없이 쓰는 앱이면 쌓지 않음
    const b = this.load();
    b.push({ id, data });
    if (b.length > this.MAX) b.splice(0, b.length - this.MAX);
    this.keep(); this.flush();
  },
  remove(id){
    const b = this.load(), i = b.findIndex(x => x.id === id && x.data);
    // 아직 안 보낸 기록이면 그냥 빼고, 이미 보냈으면 지우기를 보냄
    if (i >= 0 && !this.busy) { b.splice(i, 1); this.keep(); } else this.add(id, null);
  },
  flush(){
    const b = this.load();
    if (this.busy || !b.length || Sync.phase !== 'live' || !Sync.adapter || !Sync.user) return;
    const sent = b.slice(0, 400);
    this.busy = true;
    Sync.adapter.commit(Sync.user.uid, sent.map(x => ({ kind: 'reviewLogs', id: x.id, data: x.data })))
      .then(() => { const done = new Set(sent.map(this.sig)); this.box = this.load().filter(x => !done.has(this.sig(x))); this.keep(); this.busy = false; if (this.box.length) this.flush(); })
      .catch(err => { this.busy = false; console.warn('review log upload failed (will retry later)', err); });
  },
};
function srsGrade(rating){
  const s = sessions.review; if (!s || !s.cur || !s.flipped) return;
  const id = s.cur, now = Date.now();
  const prev = cardState(id), before = prev ? Object.assign({}, prev) : null;
  const next = Object.assign(SRS.schedule(prev ? pickDoc('cardStates', prev) : null, rating, now, srsOpts(now)), { id, firstAt: prev ? (prev.firstAt || now) : now, updatedAt: now });
  if (prev) Object.assign(prev, next); else db.cardStates.push(next);
  // 학습 기록(달력): 본 카드 수, 처음 본 단어 수, 맞힌 수
  const dk = dayKey(); let d = dayById(dk); if (!d) { d = { id: dk }; db.days.push(d); }
  const inc = (k, n) => { d[k] = (d[k] || 0) + n; };
  inc('srs', 1); if (!prev) inc('srsNew', 1); if (rating !== 'again') inc('srsOk', 1); d.updatedAt = now;
  const was = before || SRS.newCard();
  const logId = id + '_' + now;
  ReviewLog.add(logId, {
    wordId: wid(id), dir: dirOf(id), rating, reviewedAt: now, exam: !!srsOpts(now).capAt,
    prevState: was.state, state: next.state,
    prevInterval: was.interval || 0, interval: next.interval,
    prevEase: was.ease, ease: next.ease,
    prevDue: was.due || 0, due: next.due,
    lastReviewedAt: was.lastReviewedAt || 0,
  });
  s.undo = { id, before, dk, isNew: !prev, ok: rating !== 'again', logId };
  s.done++; s.cur = null; s.flipped = false;
  save(); render();
}
function srsUndo(){
  const s = sessions.review; if (!s || !s.undo) return;
  const u = s.undo, now = Date.now();
  if (u.before) Object.assign(cardState(u.id) || {}, u.before, { updatedAt: now });
  else db.cardStates = db.cardStates.filter(c => c.id !== u.id);
  if (u.before && !cardState(u.id)) db.cardStates.push(Object.assign({}, u.before, { updatedAt: now }));
  const d = dayById(u.dk);
  if (d) { const dec = k => { if (d[k]) d[k]--; if (!d[k]) delete d[k]; }; dec('srs'); if (u.isNew) dec('srsNew'); if (u.ok) dec('srsOk'); d.updatedAt = now; }
  if (u.logId) ReviewLog.remove(u.logId);
  s.done = Math.max(0, s.done - 1); s.undo = null;
  s.cur = u.id; s.flipped = true;
  const st = cardState(u.id); s.stamp = st ? st.updatedAt : 0;
  save(); render(); toast('되돌렸어요');
}
// 앞으로 7일 동안 날마다 복습할 카드 수 (오늘 칸에는 밀린 것과 오늘 학습 중인 것 포함)
function upcoming(){
  const now = Date.now(), ds = SRS.dayStart(now), out = [];
  const starts = Array.from({ length: 8 }, (_, i) => SRS.addDays(ds, i));
  const live = new Set(db.words.map(w => w.id)), dirs = activeDirs();
  for (let i = 0; i < 7; i++) out.push({ t: starts[i], n: 0 });
  db.cardStates.forEach(c => {
    if (!live.has(wid(c.id)) || !dirs.includes(dirOf(c.id)) || c.state === 'new') return;
    const i = c.due < starts[1] ? 0 : starts.findIndex((t, j) => j < 7 && c.due >= t && c.due < starts[j + 1]);
    if (i >= 0) out[i].n++;
  });
  return out;
}

function calendar(){

function bindCard(){
  const wrap = $('cardWrap'); if (!wrap) return;
  let sx = null, dx = 0;
  wrap.addEventListener('pointerdown', e => { sx = e.clientX; dx = 0; try { wrap.setPointerCapture(e.pointerId); } catch(_){} wrap.classList.add('dragging'); });
  wrap.addEventListener('pointermove', e => {
    if (sx === null) return;
    dx = e.clientX - sx;
    wrap.style.transform = `translateX(${dx}px) rotate(${dx / 28}deg)`;
    wrap.dataset.lean = dx > 50 ? 'yes' : dx < -50 ? 'no' : '';
  });
  const end = () => {
    if (sx === null) return;
    const d = dx; sx = null;

  wrap.addEventListener('pointercancel', () => { sx = null; wrap.classList.remove('dragging'); wrap.style.transform = ''; wrap.dataset.lean = ''; });
