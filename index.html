  'bulk-add': async () => {
    const text = $('bulkText').value;
    const deckId = $('fDeck').value;
    let rows = [], skipped = 0;
    text.split(/\r?\n/).forEach(line => {
      if (!line.trim()) return;
      const sep = line.includes('\t') ? '\t' : line.includes(',') ? ',' : null;
      const parts = sep ? line.split(sep).map(p => p.trim()) : [line.trim()];
      if (!parts[0]) { skipped++; return; }
      // 쉼표로 나눈 경우 세 번째 칸 이후는 예문으로 합침
      const example = sep === '\t' ? (parts[2] || '') : parts.slice(2).join(', ');
      rows.push({ term: parts[0], meaning: parts[1] || '', example, line });
    });
    if (!rows.length) { toast(skipped ? '형식을 확인해 주세요' : '추가할 단어를 적어 주세요'); return; }
    // 뜻이 비어 있는 줄은 자동으로 찾아 채움
    const need = rows.filter(r => !r.meaning);
    let failed = [];
    if (need.length) {
      const btn = $('bulkBtn'), st = $('bulkState');
      btn.disabled = true; st.textContent = `뜻 찾는 중… 0/${need.length}`;
      try {
        const found = await lookupMany([...new Set(need.map(r => r.term))], deckLang(deckId), (d, n) => { st.textContent = `뜻 찾는 중… ${d}/${n}`; });
        need.forEach(r => {
          const res = found.get(r.term);
          if (res && res.meanings.length) { r.meaning = res.meanings.slice(0, 2).join(', '); if (!r.example && res.example) r.example = res.example; }
        });
      } catch (e) {
        toast(lookupErrorText(e), 3600);
      } finally {
        if ($('bulkBtn')) { $('bulkBtn').disabled = false; $('bulkState').textContent = ''; }
      }
      failed = rows.filter(r => !r.meaning);
      rows = rows.filter(r => r.meaning);
      if (!rows.length) { toast('뜻을 찾지 못했어요. 철자를 확인하거나 "단어, 뜻" 형식으로 적어 주세요', 3600); return; }
    }
    // 이미 있는 단어, 그리고 붙여 넣은 목록 안에서 겹치는 단어를 찾음
    const seen = new Set();
    rows.forEach(r => {
      const keys = termKeys(r.term);
      const existing = findDuplicates(r.term);
      const inBatch = keys.some(k => seen.has(k));
      keys.forEach(k => seen.add(k));
      r.dupOf = existing[0] || null;
      r.dupInBatch = !existing.length && inBatch;
    });
    const dups = rows.filter(r => r.dupOf || r.dupInBatch);
    pendingBulk = { deckId, rows, skipped, failed: failed.map(r => r.line) };
    if (!dups.length) { commitBulk(false); return; }
    const shown = dups.slice(0, 8);
    $('bulkNotice').innerHTML = `<div class="notice">
      <div class="warnhead"><i>!</i><strong>겹치는 단어가 ${dups.length}개 있어요</strong></div>
      <p class="muted" style="font-size:13px">추가하려는 ${rows.length}개 중 아래 단어는 이미 단어장에 있거나 목록 안에서 두 번 나와요.</p>
      <ul class="duplist">${shown.map(r => `<li><b>${esc(r.term)}</b><span>${r.dupOf
        ? `이미 있음 · ${esc(r.dupOf.meaning)} (${esc(deckById(r.dupOf.deckId)?.name || '')})`
        : '목록 안에서 중복'}</span></li>`).join('')}</ul>
      ${dups.length > shown.length ? `<p class="muted" style="font-size:13px">외 ${dups.length - shown.length}개</p>` : ''}
      <div class="row end">
        <button class="btn ghost" data-action="notice-close" data-target="bulkNotice">취소</button>
        <button class="btn" data-action="bulk-commit" data-all="1">모두 추가</button>
        <button class="btn primary" data-action="bulk-commit">겹치는 것 빼고 (${rows.length - dups.length}개)</button>
      </div></div>`;
    $('bulkNotice').scrollIntoView({ block: 'nearest' });
  },
  'bulk-commit': a => commitBulk(a.dataset.all === '1'),
  'notice-close': a => { $(a.dataset.target).innerHTML = ''; pendingAdd = pendingBulk = null; $('fTerm')?.focus(); },
  'add-open': () => openAddSheet(),
  'add-mode': a => {
    addMode = a.dataset.mode;
    document.querySelectorAll('[data-action="add-mode"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === addMode));
    $('addForm').hidden = addMode !== 'one'; $('bulkPane').hidden = addMode !== 'many';
    (addMode === 'one' ? $('fTerm') : $('bulkText')).focus();
  },
  'dup-add-anyway': () => {
    const p = pendingAdd; if (!p) return;
    addWord(p.deckId, p.term, p.meaning, p.example);
    afterSingleAdd(p.term);
  },
  'dup-edit': a => { pendingAdd = null; editSheet(a.dataset.id); },
  // 뜻쓰기
  'mn-start': () => startMean(pickSession(currentWords(), 10)),
  'mn-speak': () => { const s = sessions.mean; const w = s && wordById(s.queue[s.i]); if (w) speakWord(w); },
  'mn-example': () => { const s = sessions.mean; s.input = $('meanInput')?.value ?? s.input; s.showExample = !s.showExample; render(); },
  'mn-override': () => {
    const s = sessions.mean; if (!s || !s.answered || s.ok) return;
    const id = s.queue[s.i]; const w = wordById(id);
    if (w && s.snap) Object.assign(w, s.snap);   // 틀림으로 기록된 것을 되돌리고
    grade(id, true);                              // 맞음으로 다시 기록
    s.ok = true; s.overridden = true; s.score++;
    s.missed = s.missed.filter(x => x !== id);
    render(); $('mnNext')?.focus({ preventScroll: true });
  },
  'mn-next': () => {
    const s = sessions.mean;
    s.i++; s.answered = false; s.ok = null; s.input = ''; s.showExample = false; s.overridden = false; s.snap = null;
    render();
  },
  'mn-retry': () => startMean(shuffle(sessions.mean.missed)),
  'mn-new': () => { sessions.mean = null; render(); },
  // 플래시카드
  'fc-start': () => {
    const words = currentWords();
    const ids = opts.fcSource === 'due' ? pickSession(words, 30, true) : shuffle(words).slice(0, 30).map(w => w.id);
    if (!ids.length) { toast('카드가 없어요'); return; }
    sessions.cards = { queue: ids, i: 0, known: 0, missed: [], flipped: false }; render();
  },
  'fc-yes': () => answerCard(true),
  'fc-no': () => answerCard(false),
  'fc-speak': () => { const s = sessions.cards; const w = s && wordById(s.queue[s.i]); if (w) speakWord(w); },
  'fc-retry': () => { const ids = shuffle(sessions.cards.missed); sessions.cards = { queue: ids, i: 0, known: 0, missed: [], flipped: false }; render(); },
  'fc-new': () => { sessions.cards = null; render(); },
  // 받아쓰기
  'dc-start': () => startDict(pickSession(currentWords(), 10)),
  'dc-play': a => { const s = sessions.dict; const w = s && wordById(s.queue[s.i]); if (w) speakWord(w, a.dataset.rate ? Number(a.dataset.rate) : undefined); },
  'dc-meaning': () => { const s = sessions.dict; s.input = $('dictInput')?.value ?? s.input; s.showMeaning = !s.showMeaning; render(); },
  'dc-next': () => {
    const s = sessions.dict;
    s.i++; s.answered = false; s.ok = null; s.near = false; s.input = ''; s.showMeaning = false;
    render();
    const w = s.i < s.queue.length && wordById(s.queue[s.i]); if (w && canSpeak) speakWord(w);
  },
  'dc-retry': () => startDict(shuffle(sessions.dict.missed)),
  'dc-new': () => { sessions.dict = null; render(); },
  // 퀴즈
  'qz-start': () => startQuiz(pickSession(currentWords(), 10)),
  'qz-choose': a => chooseQuiz(Number(a.dataset.idx)),
  'qz-speak': () => { const s = sessions.quiz; const w = s && wordById(s.qs[s.i].id); if (w) speakWord(w); },
  'qz-next': () => { const s = sessions.quiz; s.i++; s.selected = null; render(); },
  'qz-retry': () => startQuiz(shuffle(sessions.quiz.missed)),
  'qz-new': () => { sessions.quiz = null; render(); },
  // 설정
  'deck-rename': a => {
    const d = deckById(a.dataset.id); if (!d) return;
    openSheet(`<form id="renameForm" data-id="${d.id}" style="display:flex;flex-direction:column;gap:12px" autocomplete="off">
      <h2 style="font-size:20px">단어장 이름 변경</h2>
      <input class="input" id="renameIn" required value="${esc(d.name)}" aria-label="단어장 이름">
      <div class="row end"><button type="button" class="btn" data-action="sheet-close">취소</button><button class="btn primary" type="submit">저장</button></div>
    </form>`);
  },
  'deck-delete-ask': a => {
    const d = deckById(a.dataset.id); if (!d) return;
    const n = db.words.filter(w => w.deckId === d.id).length;
    openSheet(`<h2 style="font-size:20px">'${esc(d.name)}' 단어장을 삭제할까요?</h2>
      <p>안에 있는 단어 <b class="num">${n}</b>개도 함께 지워지고 되돌릴 수 없어요.</p>
      <div class="row end"><button class="btn" data-action="sheet-close">취소</button><button class="btn bad" data-action="deck-delete-confirm" data-id="${d.id}">삭제</button></div>`);
  },
  'deck-delete-confirm': a => {
    const id = a.dataset.id;
    db.decks = db.decks.filter(d => d.id !== id);
    db.words = db.words.filter(w => w.deckId !== id);
    if (db.settings.currentDeck === id) db.settings.currentDeck = 'all';
    fillDefaults(db); picked.delete(id);
    save(); closeSheet(); resetSessions(); render(); toast('단어장을 삭제했어요');
  },
  'speak-test': a => {
    const sample = { 'en-US':'Hello, nice to meet you.', 'en-GB':'Hello, nice to meet you.', 'hr-HR':'Dobar dan, drago mi je.', 'sr-RS':'Dobar dan, drago mi je.', 'ja-JP':'こんにちは', 'zh-CN':'你好', 'es-ES':'Hola, mucho gusto.', 'fr-FR':'Bonjour, enchanté.', 'de-DE':'Hallo, freut mich.' };
    const lang = a.dataset.lang || 'en-US';
    speak(sample[lang] || 'Hello', undefined, lang);
  },
  'export-copy': () => {
    const box = $('exportBox'); const text = box.value;
    const fallback = () => { box.focus(); box.select(); toast('선택된 내용을 직접 복사해 주세요'); };
    try { navigator.clipboard.writeText(text).then(() => toast('백업 내용을 복사했어요'), fallback); } catch (e) { fallback(); }
  },
  'import-ask': () => {
    let data;
    try { data = JSON.parse($('importBox').value); } catch (e) { toast('백업 형식이 아니에요. 복사한 내용을 그대로 붙여 넣어 주세요.', 3000); return; }
    if (!validData(data)) { toast('단어장 정보가 들어 있지 않은 내용이에요', 3000); return; }
    window._pendingImport = data;
    openSheet(`<h2 style="font-size:20px">백업을 불러올까요?</h2>
      <p>지금 있는 단어 <b class="num">${db.words.length}</b>개가 백업의 단어 <b class="num">${data.words.length}</b>개로 바뀌어요.</p>
      <div class="row end"><button class="btn" data-action="sheet-close">취소</button><button class="btn primary" data-action="import-confirm">불러오기</button></div>`);
  },
  'import-confirm': () => {
    const data = window._pendingImport; if (!data) return;
    delete data.exportedAt;
    db = fillDefaults(data); window._pendingImport = null;
    save(); closeSheet(); resetSessions(); render(); toast('백업을 불러왔어요');
  }
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (a && !a.disabled && actions[a.dataset.action]) { actions[a.dataset.action](a, e); return; }
  if (e.target === $('sheet') && !$('sheet').dataset.lock) { csvState = null; closeSheet(); }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'authForm') { authRun('signin'); return; }
  if (f.id === 'addForm') {
    const term = $('fTerm').value.trim(), meaning = $('fMeaning').value.trim();
    if (!term) return;
    if (!meaning) { $('fMeaning').focus(); lookupSingle(false); return; }
    const dups = findDuplicates(term);
    if (dups.length) {
      pendingAdd = { deckId: $('fDeck').value, term, meaning, example: $('fExample').value };
      $('addNotice').innerHTML = `<div class="notice">
        <div class="warnhead"><i>!</i><strong>'${esc(term)}'은(는) 이미 있는 단어예요</strong></div>
        <ul class="duplist">${dups.map(w => `<li><b>${esc(w.term)}</b><span>${esc(w.meaning)} · ${esc(deckById(w.deckId)?.name || '')}</span></li>`).join('')}</ul>
        <div class="row end">
          <button type="button" class="btn ghost" data-action="notice-close" data-target="addNotice">취소</button>
          ${dups.length === 1 ? `<button type="button" class="btn" data-action="dup-edit" data-id="${dups[0].id}">기존 단어 수정</button>` : ''}
          <button type="button" class="btn primary" data-action="dup-add-anyway">그래도 추가</button>
        </div></div>`;
      $('addNotice').scrollIntoView({ block: 'nearest' });
      return;
    }
    addWord($('fDeck').value, term, meaning, $('fExample').value);
    afterSingleAdd(term);
  } else if (f.id === 'editForm') {
    const w = wordById(f.dataset.id); if (!w) return;
    w.term = $('eTerm').value.trim() || w.term;
    w.meaning = $('eMeaning').value.trim() || w.meaning;
    w.example = $('eExample').value.trim();
    w.deckId = $('eDeck').value;
    w.updatedAt = Date.now();
    save(); closeSheet(); resetSessions(); render(); toast('저장했어요');
  } else if (f.id === 'meanForm') {
    const s = sessions.mean; if (!s || s.answered) return;
    const w = wordById(s.queue[s.i]); if (!w) return;
    s.input = $('meanInput').value;
    if (!s.input.trim()) { toast('뜻을 입력해 주세요'); return; }
    s.ok = isMeaningMatch(s.input, w.meaning);
    s.snap = { box: w.box, nextReview: w.nextReview, correct: w.correct, wrong: w.wrong };
    s.answered = true;
    grade(w.id, s.ok);
    if (s.ok) s.score++; else s.missed.push(w.id);
    render();
    $('mnNext')?.focus({ preventScroll: true });
  } else if (f.id === 'dictForm') {
    const s = sessions.dict; if (!s || s.answered) return;
    const w = wordById(s.queue[s.i]); if (!w) return;
    s.input = $('dictInput').value;
    if (!s.input.trim()) { toast('들은 단어를 입력해 주세요'); return; }
    s.ok = isMatch(s.input, w.term);
    s.near = !s.ok && isLooseMatch(s.input, w.term);
    if (s.near) s.ok = true;   // 부호만 다르면 정답으로 치되 알려 줌
    s.answered = true;
    grade(w.id, s.ok);
    if (s.ok) s.score++; else s.missed.push(w.id);
    render();
    $('dcNext')?.focus({ preventScroll: true });
  } else if (f.id === 'deckForm') {
    const name = $('newDeck').value.trim(); if (!name) return;
    const d = { id: uid(), name, lang: $('newDeckLang').value, createdAt: Date.now(), updatedAt: Date.now() };
    db.decks.push(d); db.settings.currentDeck = d.id;
    save(); resetSessions(); render(); toast(`'${name}' 단어장을 만들었어요`);
  } else if (f.id === 'newDeckSheet') {
    const name = $('ndName').value.trim(); if (!name) return;
    const d = { id: uid(), name, lang: $('ndLang').value, createdAt: Date.now(), updatedAt: Date.now() };
    db.decks.push(d); db.settings.currentDeck = d.id; deckOpen = true; searchText = '';
    save(); closeSheet(); resetSessions(); render(); toast(`'${name}' 단어장을 만들었어요`);
    openAddSheet('one');
  } else if (f.id === 'renameForm') {
    const d = deckById(f.dataset.id); const name = $('renameIn').value.trim();
    if (d && name) { d.name = name; d.updatedAt = Date.now(); save(); }
    closeSheet(); render();
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'csvName' && csvState) { csvState.name = e.target.value; return; }
  if (e.target.id === 'search') { searchText = e.target.value; $('wordList').innerHTML = wordItems(currentWords()); }
  if (e.target.id === 'rateIn') { db.settings.rate = Number(e.target.value); $('rateOut').textContent = db.settings.rate.toFixed(2); save(); }
  if (e.target.id === 'dictInput' && sessions.dict) sessions.dict.input = e.target.value;
  if (e.target.id === 'meanInput' && sessions.mean) sessions.mean.input = e.target.value;
  if (e.target.id === 'fTerm') {
    clearTimeout(lookTimer);
    // 단어가 바뀌면 이전 단어로 자동 채운 뜻·예문은 지움 (직접 쓴 내용은 그대로 둠)
    if (autoMeaning && $('fMeaning').value === autoMeaning) $('fMeaning').value = autoMeaning = '';
    if (autoExample && $('fExample').value === autoExample) $('fExample').value = autoExample = '';
    lookSeq++; setLookState(''); showSuggest(null);
    if ($('addNotice')) { $('addNotice').innerHTML = ''; pendingAdd = null; }
    if (!e.target.value.trim()) return;
    lookTimer = setTimeout(() => { if (!$('fMeaning')?.value.trim()) lookupSingle(true); }, 1200);
  }
  if (e.target.id === 'fMeaning' && !$('suggest').hidden) {
    const parts = currentMeaningParts();
    document.querySelectorAll('#suggest .pick').forEach(b => b.setAttribute('aria-pressed', parts.includes(b.dataset.m)));
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'csvFile') { const f = e.target.files && e.target.files[0]; closeSheet(); openCsvFile(f, e.target.dataset.target); return; }
  if (csvState && /^csv/.test(e.target.id)) {
    const s = csvState, v = e.target.value;
    if (e.target.id === 'csvTarget') s.target = v;
    if (e.target.id === 'csvLang') s.lang = v;
    if (e.target.id === 'csvTerm') s.term = Number(v);
    if (e.target.id === 'csvMeaning') s.meaning = Number(v);
    if (e.target.id === 'csvExample') s.example = Number(v);
    if (e.target.id === 'csvHeader') s.hasHeader = e.target.checked;
    if (e.target.id === 'csvFill') s.fill = e.target.checked;
    if (e.target.id === 'csvSkipDup') s.skipDup = e.target.checked;
    if (e.target.id !== 'csvName') renderCsvSheet();
    return;
  }
  if (e.target.id === 'deckSelect') { db.settings.currentDeck = e.target.value; save(); resetSessions(); render(); }
  if (e.target.classList.contains('decklang')) { const d = deckById(e.target.dataset.id); if (d) { d.lang = e.target.value; d.updatedAt = Date.now(); save(); toast(`'${d.name}' 언어를 바꿨어요`); } }
  if (e.target.id === 'fDeck') { lastLooked = ''; syncAddLang(); }
  if (e.target.id === 'fTerm') { clearTimeout(lookTimer); if (!$('fMeaning').value.trim() || $('fMeaning').value === autoMeaning) lookupSingle(true); }
});

document.addEventListener('pointerdown', e => { if (e.target.closest('.charpad button')) e.preventDefault(); });
document.addEventListener('mousedown', e => { if (e.target.closest('.charpad button')) e.preventDefault(); });

document.addEventListener('keydown', e => {
  // 추가 창: 엔터나 탭을 누르면 뜻 찾기 버튼이나 후보를 거치지 않고 다음 칸으로
  if ((e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey)) && ['fTerm', 'fMeaning', 'fExample'].includes(e.target.id)) {
    if (e.isComposing || e.keyCode === 229) return;   // 한글 조합 중인 엔터는 무시
    e.preventDefault();
    if (e.target.id === 'fTerm') {
      if (!e.target.value.trim()) return;
      clearTimeout(lookTimer);
      if (!$('fMeaning').value.trim()) lookupSingle(true);
      $('fMeaning').focus();
    } else if (e.target.id === 'fMeaning') {
      $('fExample').focus();
    } else {
      $('addForm').requestSubmit ? $('addForm').requestSubmit() : $('addForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    }
    return;
  }
  if (e.key === 'Escape' && !$('sheet').hidden) { if (!$('sheet').dataset.lock) closeSheet(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || !$('sheet').hidden) return;
  if (view === 'cards' && sessions.cards && sessions.cards.i < sessions.cards.queue.length) {
    if (e.key === 'ArrowRight') answerCard(true);
    else if (e.key === 'ArrowLeft') answerCard(false);
    else if (e.key === ' ' && e.target.id !== 'cardWrap') { e.preventDefault(); flipCard(); }
  }
  if (view === 'quiz' && sessions.quiz && sessions.quiz.i < sessions.quiz.qs.length) {
    const n = Number(e.key);
    if (n >= 1 && n <= 4 && sessions.quiz.selected === null) chooseQuiz(n - 1);
  }
});

render();
Sync.changed();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
